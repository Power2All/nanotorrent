[package]
name = "nanotorrent"
version = "0.3.2"
edition = "2024"
default-run = "nanotorrent-gui"
description = "NanoTorrent - a tiny, hackable BitTorrent client (Rust port of PicoTorrent)"
license = "MIT"

# Two binaries, and the plain name belongs to the CONSOLE one.
#
# cmd and PowerShell decide whether to wait for a process from the PE subsystem
# field, before any of its code runs - they never wait for a GUI binary. So
# `nanotorrent --help` could only return the prompt after its own output unless
# the thing the shell launches is a console program. This is the split Python
# ships as python.exe / pythonw.exe, for the same reason.
#
# The GUI is `nanotorrent-gui`; the installer points every shortcut, file
# association and the magnet handler at it, so an ordinary launch never opens a
# console. On Linux and macOS the packaging installs it AS `nanotorrent` - the
# subsystem problem is Windows-only and the shim is not shipped there.
[[bin]]
name = "nanotorrent-cli"
path = "src/bin/console.rs"

[[bin]]
name = "nanotorrent-gui"
path = "src/main.rs"

[features]
default = ["ui-slint"]
# The UI: the same window on Windows, Linux and macOS. Turning it off
# (--no-default-features) gives a headless daemon reachable over the web
# interface, which is the only other supported configuration.
ui-slint = ["dep:slint", "dep:slint-build", "dep:rfd", "dep:raw-window-handle", "dep:copypasta", "dep:png"]

[dependencies]
# Actix rather than axum for the web API, chosen for its connection layer, not
# its routing. actix-http runs a 5s client_request_timeout by default and
# actix-server caps concurrent connections; axum::serve wires up neither, and
# hyper's equivalents are all opt-in. Those protections live inside actix-http's
# dispatcher, which owns the socket, codec and timers together - there is no
# seam to lift them out through and bolt onto hyper, so this is an
# either/or. Costs ~74 crates against axum's ~17 (measured) because Actix ships
# its own HTTP stack instead of reusing the hyper/tower already here for
# reqwest. Worth it: hand-rolled accept loops and timeout wrappers are exactly
# the code not to write yourself.
#
# Defaults minus compress-brotli, compress-zstd, cookies and ws: this serves
# JSON and one small HTML page, so gzip covers it, and zstd-sys is a C build
# for nothing. Basic auth needs no cookies. Re-add ws if live stats ever want
# a socket rather than SSE.
actix-web = { version = "4", default-features = false, features = ["macros", "compress-gzip", "http2", "unicode", "compat", "rustls-0_23"] }
anyhow = "1.0.104"
# Password hashing for the web API. A slow KDF, not sha2 (already present):
# people reuse passwords, and the settings DB is a plain file.
# Default features: they include `getrandom`, which is what supplies
# password-hash's OsRng for salt generation. 0.5 needed `std` asked for
# explicitly to get the same thing; 0.6 dropped that feature and folded
# getrandom into the defaults, so naming features here would only risk
# switching one off.
argon2 = "0.6"
base64 = "0.23"
bencode = { version = "9.0.1", package = "librqbit-bencode", default-features = false }
chrono = "0.4.45"
flate2 = "1.1.9"
futures = "0.3.33"
num-bigint = "0.5"
sha1 = "0.11"
sha2 = "0.11"
rand = "0.10"
# rust-tls rather than the default default-tls. On Linux the default drags in
# OpenSSL TWICE: once as native-tls for the tracker/UPnP HTTP client, and once
# as crypto-hash for librqbit's SHA-1 piece hashing. rust-tls replaces the first
# with rustls and the second with aws-lc-rs (the feature is named sha1-ring, but
# sha1w 4.x maps it to aws-lc-rs).
#
# aws-lc-sys was ALREADY being compiled (rustls 0.23 uses it as its default
# crypto provider), so this adds no build requirement - it points SHA-1 at a
# library the build already produces, and drops 16 crates including the whole
# openssl / native-tls / commoncrypto chain. Static, so no per-distro libssl to
# version-match when shipping AppImage/.deb/.dmg.
#
# One behaviour change: reqwest's rustls-tls verifies with bundled webpki-roots
# rather than the OS trust store, so a private CA on an HTTPS tracker would no
# longer be trusted. The update check is unaffected - it goes through this
# crate's own reqwest, which uses rustls-platform-verifier.
#
# Measured cost, so nobody re-runs the A/B in a panic: the release exe goes from
# 16.46 MB to 17.11 MB, i.e. +0.62 MB. aws-lc was already linked for rustls, so
# SHA-1 only adds its digest code. (The ~4.9 MB figure people remember is the
# UPX-packed installer payload, not the linker's output.)
#
# The other default feature, http-api-client, is unused here.
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls"] }
# Named directly for the BEP 52 hash messages (engine patch 0010): the v2
# magnet interceptor builds and reads them. Already in the tree as librqbit's
# own dependency, and pinned to the same vendored copy by [patch.crates-io],
# so this costs no extra crate.
librqbit-peer-protocol = { version = "9.0.1", default-features = false }
maxminddb = "0.30"
open = "5.4.1"
# Generates the self-signed certificate for the web API on first use, so HTTPS
# works out of the box without asking anyone to run openssl.
rcgen = "0.14"
# The plugin scripting engine. Pure Rust, so it adds no C build to the three
# platform matrix, and its limits (max_operations, call depth, string/array
# size) are constructor arguments rather than a hand-rolled debug hook - which
# is the whole argument for it over embedding Lua. no_std off, no_module off:
# plugins import each other from the plugin folder.
rhai = "1"
# Native file/folder pickers for the Slint UI - Slint has none of its own.
# xdg-portal rather than the gtk3 backend: a torrent client should not drag GTK
# into a Linux build to show one Open dialog, and the portal is what Wayland
# desktops expect anyway. It is upstream's default too, but named explicitly so
# a change of theirs cannot quietly pull GTK back in.
#
# No async-runtime feature: 0.15 needed one (`tokio`, routing ashpd's calls),
# where 0.17's xdg-portal drives its own executor through pollster. That is why
# the `tokio` feature no longer exists rather than having been dropped here.
rfd = { version = "0.17", optional = true, default-features = false, features = ["xdg-portal"] }
reqwest = { version = "0.13.4", features = ["json"] }
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
# Default features deliberately: that selects aws-lc-rs, which the tree already
# resolves rustls to. Picking `ring` here would compile a second crypto library.
rustls = "0.23"
rustls-pemfile = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# XML for plugins: parse_xml, so a feed reader plugin does not have to write a
# parser in Rhai. Already in the tree via librqbit-upnp, so this costs nothing.
#
# HELD at 0.41 deliberately. librqbit-upnp 9.0.1 asks for "0.41", and a 0.x
# minor bump is breaking in semver, so moving to 0.42 does not upgrade the
# shared copy - it compiles a second one alongside it. Bump this when the
# vendored librqbit moves, not before.
quick-xml = "0.41"
# The UI toolkit. Optional so --no-default-features gives a headless daemon.
# Decoding res/flags/*.png into Slint images for the peers list. Already in the
# tree via Slint's own image support, so naming it costs no new crate.
png = { version = "0.18", optional = true }
# Clipboard. Slint has no public clipboard API - only TextInput's internal
# copy/paste - but its winit backend already builds copypasta for exactly that,
# so naming it directly costs no new crate.
copypasta = { version = "0.10", optional = true }
# The HWND behind the Slint window, for EnableWindow. Same version slint
# already pulls in, so this costs no new crate.
raw-window-handle = { version = "0.6", optional = true }
# raw-window-handle-06 for the HWND behind the Slint window: real modality on
# Windows is EnableWindow on the owner, which needs it. Adds no crates - it is
# already in the tree.
slint = { version = "1", optional = true, features = ["raw-window-handle-06"] }
# Constant-time comparison for the auth username. argon2 already compares the
# password hash in constant time; the username needs the same treatment or it
# leaks through timing.
subtle = "2.6"
# "time" for the session's lifecycle scan tick. It was already on through
# feature unification with librqbit; naming it here means a dependency change
# elsewhere cannot silently take our timer away.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "signal", "time"] }
tracing = "0.1.44"
# env-filter: everything this app does goes in the log at debug, while the
# dependencies stay at info - librqbit traces every chunk and would bury it.
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
# Compiles src/ui_slint/*.slint. Optional so a headless build does not pay for
# it; build.rs gates the call on the same feature.
slint-build = { version = "1", optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

# statvfs, for the free-space check that pauses torrents before the disk
# fills. Windows uses GetDiskFreeSpaceExW from winapi below instead.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Desktop notifications on Linux (D-Bus) and macOS. Windows has its own path
# through tauri-winrt-notification below, which is why this is not a plain
# dependency. Default features only: that is `z`, the pure-Rust zbus client,
# so no libdbus to link and no `image` crate pulled in for an icon we set by
# name.
notify-rust = "4"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
# NOT tied to any UI feature: core/toast.rs, core/file_assoc.rs, the startup
# message box in main.rs and ui_slint/modal.rs all need winapi under plain
# cfg(windows), whether or not a UI is built.
winapi = { version = "0.3.9", features = ["winuser", "windef", "winreg", "fileapi", "winnt", "objbase", "combaseapi", "shobjidl_core", "objidl", "propidl", "propkey", "propsys", "wtypesbase", "wtypes", "winerror", "wincon", "processenv", "handleapi"] }

# --- Linux packaging -------------------------------------------------------
# Consumed by `cargo deb` and `cargo generate-rpm` in .github/workflows/release.yml.
# Both install the same three files; keep them in step.
#
# The icon must land as `org.nanotorrent.NanoTorrent.png` under hicolor/256x256
# because the .desktop entry says `Icon=org.nanotorrent.NanoTorrent`, and its
# StartupWMClass must match slint::set_xdg_app_id - that chain is what gives
# the window its icon on Wayland, which has no protocol for a client to set one
# itself.

[package.metadata.deb]
maintainer = "Power2All <power2all@users.noreply.github.com>"
copyright = "Power2All"
section = "net"
priority = "optional"
# X11/Wayland/GL are dlopen'd at runtime, so shlibdeps cannot see them and they
# are listed by hand. Everything else $auto finds from the ELF.
depends = "$auto, libfontconfig1"
extended-description = """A tiny, hackable BitTorrent client - a Rust port of PicoTorrent. DHT, UDP trackers, MSE/PE encryption, labels and filters, a details pane with per-file control, and an optional authenticated web interface."""
assets = [
    ["target/release/nanotorrent-gui", "usr/bin/nanotorrent", "755"],
    ["packaging/linux/org.nanotorrent.NanoTorrent.desktop", "usr/share/applications/", "644"],
    ["res/app.png", "usr/share/icons/hicolor/256x256/apps/org.nanotorrent.NanoTorrent.png", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/nanotorrent-gui", dest = "/usr/bin/nanotorrent", mode = "755" },
    { source = "packaging/linux/org.nanotorrent.NanoTorrent.desktop", dest = "/usr/share/applications/org.nanotorrent.NanoTorrent.desktop", mode = "644" },
    { source = "res/app.png", dest = "/usr/share/icons/hicolor/256x256/apps/org.nanotorrent.NanoTorrent.png", mode = "644" },
]

[patch.crates-io]
librqbit = { path = "vendor/librqbit" }
librqbit-tracker-comms = { path = "vendor/librqbit-tracker-comms" }
librqbit-peer-protocol = { path = "vendor/librqbit-peer-protocol" }
librqbit-dualstack-sockets = { path = "vendor/librqbit-dualstack-sockets" }
