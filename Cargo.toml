[package]
name = "nanotorrent"
version = "0.1.0"
edition = "2024"
description = "NanoTorrent - a tiny, hackable BitTorrent client (Rust port of PicoTorrent)"
license = "MIT"

[features]
default = ["ui-native"]
ui-native = ["dep:native-windows-gui", "dep:winapi"]

[dependencies]
anyhow = "1.0.104"
bencode = { version = "3.1", package = "librqbit-bencode", default-features = false }
chrono = "0.4.45"
flate2 = "1.1.9"
futures = "0.3.33"
num-bigint = "0.5"
sha1 = "0.11"
sha2 = "0.11"
rand = "0.10"
librqbit = "8.1.1"
maxminddb = "0.30"
native-windows-gui = { version = "1.0.13", optional = true, features = ["list-view", "tabs", "tray-notification", "menu", "combobox", "textbox", "file-dialog", "animation-timer", "notice", "message-window", "flexbox", "progress-bar", "image-decoder", "cursor", "high-dpi", "clipboard"] }
winapi = { version = "0.3.9", optional = true, features = ["commctrl", "winuser", "windef", "wingdi", "dwmapi", "uxtheme", "winreg", "libloaderapi", "fileapi", "winnt", "objbase", "combaseapi", "shobjidl_core", "objidl", "propidl", "propkey", "propsys", "wtypesbase", "winerror"] }
open = "5.4.1"
reqwest = { version = "0.13.4", features = ["json"] }
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"

[patch.crates-io]
librqbit = { path = "vendor/librqbit" }
librqbit-tracker-comms = { path = "vendor/librqbit-tracker-comms" }
