<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NanoTorrent</title>
<link rel="icon" href="/favicon.ico" type="image/png">
<!--
  The web remote. One file, no build step, embedded in the binary with
  include_str! - same approach as lang/*.json and res/flags/*.png.

  Deliberately a REMOTE, not a second full client: add, watch, pause, resume,
  remove, set a torrent's location, and pick a folder on the machine
  NanoTorrent runs on. The desktop UI keeps the things that only make sense
  sitting in front of it.

  Two rules worth keeping if you edit this:

  1. Never innerHTML anything that came from the server. Torrent names come out
     of .torrent files written by strangers, so every one of them is hostile
     input. textContent everywhere.
  2. No external resources. This has to work on a LAN with no internet, and the
     CSP below blocks them anyway.
-->
<style>
/* Light is the base palette; dark redefines only the tokens. Three states, to
   mirror the desktop's View > Theme menu: no data-theme attribute follows the
   OS, and an explicit one wins in both directions. */
:root {
  color-scheme: light dark;
  --bg: #ffffff; --fg: #1a1a1a; --muted: #6a6a6a; --line: #e0e0e0;
  --panel: #f6f6f6; --accent: #0a66c2; --bar: #0a66c2; --bar-bg: #e4e4e4;
  --danger: #b3261e; --ok: #1a7f37;
  /* One height for every single-line control. They each used to carry their
     own vertical padding (.3 / .35 / .45rem) and no height at all, so a
     button, a dropdown and a text box on the same row were three different
     heights - the browser's intrinsic sizing differs per element type.
     Horizontal padding still varies by control; only the height is shared. */
  --control-h: 2.2rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #1e1e1e; --fg: #e8e8e8; --muted: #9a9a9a; --line: #333;
    --panel: #262626; --accent: #4da3ff; --bar: #2f6fb5; --bar-bg: #3a3a3a;
    --danger: #f2705f; --ok: #4ac26b;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1e1e1e; --fg: #e8e8e8; --muted: #9a9a9a; --line: #333;
  --panel: #262626; --accent: #4da3ff; --bar: #2f6fb5; --bar-bg: #3a3a3a;
  --danger: #f2705f; --ok: #4ac26b;
}
:root[data-theme="light"] { color-scheme: light; }
select {
  font: inherit; padding: .3rem .4rem; border: 1px solid var(--line);
  border-radius: 6px; background: var(--bg); color: var(--fg);
}
button,
select,
input[type=text],
input[type=number] {
  height: var(--control-h);
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 14px/1.45 system-ui, "Segoe UI", sans-serif;
}
/* Preferences drawer. A panel rather than a <dialog>: it slides in from the
   right, and dialog's own backdrop cannot be animated independently of it.
   translateX keeps the transition on the compositor. */
#scrim {
  position: fixed; inset: 0; background: rgba(0,0,0,.35);
  opacity: 0; pointer-events: none; transition: opacity .2s ease; z-index: 8;
}
#scrim.open { opacity: 1; pointer-events: auto; }
#drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(30rem, 100vw);
  background: var(--panel); border-left: 1px solid var(--line);
  transform: translateX(100%); transition: transform .22s ease;
  z-index: 9; display: flex; flex-direction: column;
}
#drawer.open { transform: translateX(0); }
@media (prefers-reduced-motion: reduce) {
  #drawer, #scrim { transition: none; }
}
#drawer header {
  position: static; display: flex; align-items: center; gap: .5rem;
  border-bottom: 1px solid var(--line);
}
#drawer h2 { font-size: 1rem; margin: 0 auto 0 0; font-weight: 600; }
#drawer-body { overflow-y: auto; padding: .75rem 1rem 1rem; flex: 1; }
#drawer-foot {
  display: flex; align-items: center; gap: .75rem;
  padding: .7rem 1rem; border-top: 1px solid var(--line);
}
#drawer-note { color: var(--muted); font-size: .78rem; flex: 1; }
#drawer-body h3 {
  font-size: .8rem; text-transform: uppercase; letter-spacing: .04em;
  color: var(--muted); margin: 1.25rem 0 .5rem; font-weight: 600;
}
#drawer-body h3:first-child { margin-top: .25rem; }
.pref { display: grid; gap: .25rem; margin-bottom: .8rem; }
.pref label { font-size: .85rem; }
.pref .row { display: flex; gap: .4rem; align-items: center; }
.pref .row input[type=text], .pref .row select { flex: 1; min-width: 0; }
.pref .row input[type=number] { width: 8rem; }
.pref .unit { color: var(--muted); font-size: .8rem; }
.hamburger { line-height: 1; padding: .3rem .55rem; }
header {
  display: flex; flex-wrap: wrap; gap: .75rem 1.25rem; align-items: center;
  padding: .7rem 1rem; border-bottom: 1px solid var(--line); background: var(--panel);
  position: sticky; top: 0; z-index: 5;
}
h1 {
  font-size: 1.05rem; margin: 0 auto 0 0; font-weight: 600;
  display: flex; align-items: center; gap: .5rem;
}
h1 img { display: block; }
.stat { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.stat b { color: var(--fg); font-weight: 600; }
button {
  font: inherit; padding: .35rem .7rem; border: 1px solid var(--line);
  border-radius: 6px; background: var(--bg); color: var(--fg); cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { color: #fff; filter: brightness(1.1); }
button.danger:hover { border-color: var(--danger); color: var(--danger); }

/* Phone width: the title takes its own line so the stats and controls have
   room to wrap. Without this the nowrap stats overflow the header and the
   whole page scrolls sideways, which is exactly what .tablewrap exists to
   prevent for the table. */
@media (max-width: 620px) {
  h1 { width: 100%; margin: 0; }
  header { gap: .5rem .9rem; padding: .6rem .7rem; }
  .stat { font-size: .85rem; }
  /* No margin-left:auto here. Pushing the button to the far right of a flex
     line that is already full makes it overflow instead of wrapping - let it
     flow after the theme picker and drop to its own line when it must. */
}

main { padding: 1rem; }
/* Wide content scrolls in its own box - the page body never scrolls sideways. */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; min-width: 720px; }
th, td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid var(--line); }
th { background: var(--panel); font-weight: 600; position: sticky; top: 0; }
tr:last-child td { border-bottom: 0; }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.name { max-width: 30rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { padding: 3rem 1rem; text-align: center; color: var(--muted); }

.bar {
  position: relative; width: 100%; min-width: 3rem; height: 1.1rem;
  background: var(--bar-bg); border-radius: 4px; overflow: hidden;
}
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--bar); display: block; }
/* The label sits over both the grey track and the coloured fill, so neither a
   light nor a dark colour is readable everywhere. A halo in the page
   background keeps it legible over both, in both themes. */
.bar > span {
  position: relative; display: block; text-align: center;
  font-size: .75rem; line-height: 1.1rem;
  text-shadow: 0 0 2px var(--bg), 0 0 2px var(--bg), 0 0 3px var(--bg);
}
.state { font-size: .8rem; color: var(--muted); }
.state.err { color: var(--danger); }
.state.up { color: var(--ok); }
.actions { display: flex; gap: .3rem; flex-wrap: nowrap; }
/* Compact enough for three of them side by side without the column having to
   be as wide as the name. */
.actions button { padding: .35rem .5rem; white-space: nowrap; }
td.act { overflow: visible; }

dialog {
  border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
  color: var(--fg); padding: 0; max-width: min(38rem, 94vw); width: 100%;
}
/* The panels that hold a list earn more width than the rest.

   `#add` has two panes side by side and torrent names to fit in them. `#plug`
   is a plugin's own window - feed titles and article headlines, which are the
   same shape of text and were being cut off at 38rem. `#plugs` lists plugin
   names with their permissions beside them.

   The rest stay narrow: a confirmation as wide as the screen reads as a page,
   not a question. */
#add, #plug, #plugs { max-width: min(76rem, 96vw); }
dialog::backdrop { background: #0008; }
.dlg-head { padding: .8rem 1rem; border-bottom: 1px solid var(--line); font-weight: 600; }
.dlg-body { padding: 1rem; display: grid; gap: .8rem; }
.dlg-foot { padding: .8rem 1rem; border-top: 1px solid var(--line); display: flex; gap: .5rem; justify-content: flex-end; }
label { display: grid; gap: .3rem; font-size: .85rem; color: var(--muted); }
input[type=text], input[type=number], input[type=file], textarea {
  font: inherit; padding: .45rem .55rem; border: 1px solid var(--line);
  border-radius: 6px; background: var(--panel); color: var(--fg); width: 100%;
}
/* Vertical only: the dialog is a grid and a wider textarea would push the
   Browse button off the row beside it. */
textarea { resize: vertical; min-height: 2.4rem; }
/* The "one per line" asides on the add form. Lighter than the label itself,
   which is already muted, so it reads as a note rather than a second label. */
.hint { opacity: .7; font-weight: 400; }

/* Torrent inspection: queue on the left, that torrent's files on the right.
   Fixed height so adding twenty torrents cannot grow the dialog off-screen -
   both panes scroll instead. */
.inspect { display: grid; grid-template-columns: 240px 1fr; gap: .5rem; height: 240px; }
.inspect-queue, .inspect-files {
  border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
  display: flex; flex-direction: column; min-width: 0;
}
.inspect-queue { overflow-y: auto; }
.inspect-list { overflow-y: auto; flex: 1; }
.inspect-head {
  padding: .35rem .5rem; background: var(--panel); border-bottom: 1px solid var(--line);
  font-size: .8rem; color: var(--muted); white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis;
}
.q-item {
  padding: .4rem .5rem; cursor: pointer; border-bottom: 1px solid var(--line);
  font-size: .8rem; overflow: hidden;
}
.q-item:last-child { border-bottom: 0; }
.q-item.sel { background: var(--accent); color: #fff; }
.q-item .q-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.q-item .q-size { display: block; opacity: .75; font-size: .72rem; }
.f-item {
  display: flex; gap: .4rem; align-items: center; padding: .25rem .5rem;
  font-size: .8rem; min-width: 0;
}
.f-item:nth-child(odd) { background: var(--panel); }
.f-item .f-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.f-item .f-size { color: var(--muted); font-size: .72rem; white-space: nowrap; }

/* Narrow screens: the two panes stack rather than squeezing the file names
   into nothing. */
@media (max-width: 560px) {
  .inspect { grid-template-columns: 1fr; height: 300px; }
}
/* The file input's inner button is a native control and keeps the browser's
   own light styling on a dark page unless it is styled by name.

   Laid out as a flex box so the button and the chosen-file text sit on the
   vertical centre line. Zeroing the padding alone was not enough: the contents
   are inline, so they aligned on the text baseline and rode high in a box that
   is taller than they are. */
input[type=file] {
  display: flex; align-items: center;
  /* Height comes from the contents plus this padding, NOT from --control-h.
     A fixed height here has to be divided evenly around a button whose height
     the browser decides, and it never quite came out level. */
  height: auto; padding: .3rem .55rem; cursor: pointer;
}
input[type=file]::file-selector-button {
  font: inherit; margin-right: .6rem; padding: 0 .6rem; cursor: pointer;
  height: calc(var(--control-h) - .7rem);
  border: 1px solid var(--line); border-radius: 5px;
  background: var(--bg); color: var(--fg);
}
input[type=file]::file-selector-button:hover { border-color: var(--accent); color: var(--accent); }
.row { display: flex; gap: .5rem; align-items: end; }
.row > label { flex: 1; }
.check { display: flex; gap: .4rem; align-items: center; color: var(--fg); font-size: .9rem; }

#browser-list { max-height: 45vh; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; }
#browser-list button {
  display: block; width: 100%; text-align: left; border: 0; border-radius: 0;
  border-bottom: 1px solid var(--line); padding: .4rem .6rem; background: none;
}
#browser-list button:last-child { border-bottom: 0; }
#browser-path { font-family: ui-monospace, Consolas, monospace; font-size: .8rem; color: var(--muted); word-break: break-all; }

#toasts { position: fixed; right: 1rem; bottom: 1rem; display: grid; gap: .5rem; z-index: 10; max-width: min(28rem, 92vw); }
.toast { padding: .6rem .8rem; border-radius: 8px; border: 1px solid var(--danger); background: var(--panel); color: var(--danger); font-size: .85rem; }
.toast.info { border-color: var(--accent); color: var(--accent); }

/* Plugin surface. Deliberately plain: a plugin supplies text, never styling,
   so nothing here can be driven from a .rhai file. */
.plug-list {
  border: 1px solid var(--line); border-radius: 6px;
  max-height: 22rem; overflow-y: auto; margin-bottom: .5rem;
}
.plug-row { padding: .35rem .5rem; cursor: pointer; border-bottom: 1px solid var(--line); }
.plug-row:last-child { border-bottom: 0; }
.plug-row:hover { background: var(--panel); }
.plug-row.sel { background: var(--accent); color: #fff; }
.plug-row .sub { display: block; font-size: .75rem; color: var(--muted); }
.plug-row.sel .sub { color: #e8e8e8; }
.plug-status { color: var(--muted); font-size: .8rem; margin: .25rem 0 .5rem; min-height: 1.1em; }
.plug-buttons { display: flex; gap: .5rem; flex-wrap: wrap; }

/* Toolbar, matching the desktop's set and order. Icons are currentColor so
   they follow the theme without a second palette. */
.tool {
  display: inline-flex; align-items: center; justify-content: center;
  width: var(--control-h); padding: 0;
}
.tool svg { width: 18px; height: 18px; fill: currentColor; }
.tool:disabled { opacity: .35; }
.tool-sep { width: 1px; height: 1.2rem; background: var(--line); margin: 0 .15rem; }

/* Throughput charts, to the desktop's geometry: 96px by default, dragged
   between 48 and 320, one grip each.

   `height` is the control height and `box-sizing: border-box`, so the border
   sits INSIDE it - without that the 1px border added 2px to the tallest thing
   in the header and pushed the whole bar taller than a button.

   The polyline is stretched rather than fitted (`preserveAspectRatio="none"`),
   which is the same lesson app.slint records: an aspect-preserving fit draws a
   sliver a few pixels wide however much room it is given. */
.chart {
  position: relative; display: inline-flex; align-items: center; gap: .3rem;
  height: var(--control-h);
}
.chart svg {
  display: block; box-sizing: border-box;
  width: 96px; height: var(--control-h);
  border: 1px solid var(--line); border-radius: 4px; background: var(--panel);
}
.chart polyline { fill: none; stroke: var(--accent); stroke-width: 2; vector-effect: non-scaling-stroke; }
#ch-ul-p { stroke: var(--ok); }
.chart b {
  font-size: .72rem; font-weight: 500; color: var(--muted);
  min-width: 4.2rem; white-space: nowrap;
}
/* Its own grip, like the desktop's: the last 8px of the box. */
.chart .cgrip {
  position: absolute; top: 0; left: 0; height: 100%; width: 8px;
  cursor: ew-resize; user-select: none;
}

/* Fixed layout so a column keeps the width it was given instead of being
   re-negotiated every refresh as torrent names come and go. */
table { table-layout: fixed; }
th { position: relative; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
td { overflow: hidden; text-overflow: ellipsis; }
/* The drag handle: its own element rather than a cursor on the th edge, so the
   hit area is wide enough to grab without being wide enough to mis-click. */
.grip {
  position: absolute; top: 0; right: 0; width: 7px; height: 100%;
  cursor: col-resize; user-select: none;
}
.grip:hover { background: var(--accent); opacity: .5; }
body.resizing { cursor: col-resize; user-select: none; }
tr.sel td { background: var(--panel); }
tbody tr { cursor: default; }

/* Plugin index rows. */
.pl-row {
  display: flex; align-items: center; gap: .6rem;
  padding: .5rem 0; border-bottom: 1px solid var(--line);
}
.pl-row:last-child { border-bottom: 0; }
.pl-main { flex: 1; min-width: 0; }
.pl-name { font-weight: 600; }
.pl-note { font-size: .75rem; color: var(--muted); }
.pl-note.err { color: var(--danger); }
.pl-note.warn { color: #b06000; }

/* Boolean settings as a toggle button rather than a bare checkbox: a lone
   checkbox in a column of text boxes is a small hit target and reads as an
   afterthought. The real <input> is still there, just visually hidden, so
   keyboard focus, space to toggle and screen readers all keep working. */
.toggle {
  display: inline-flex; align-items: center; gap: .5rem;
  /* A floor, not a fixed height: these labels are whole sentences and wrap to
     two lines on a narrow drawer, which a fixed height simply cut off. */
  min-height: var(--control-h); padding: .4rem .8rem;
  /* The drawer is narrow; let the button take the width it is given so the
     text wraps inside it rather than pushing past the edge. */
  width: 100%; text-align: left;
  border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); color: var(--fg);
  cursor: pointer; user-select: none; font-size: .9rem;
}
.toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
.toggle .tick {
  display: inline-flex; align-items: center; justify-content: center;
  width: 1.1rem; height: 1.1rem; flex: none;
  border: 1px solid var(--line); border-radius: 4px;
  background: var(--bg); font-size: .8rem; line-height: 1;
  color: transparent;
}
/* Lit when on: the tick appears and the whole button takes the accent, so the
   state reads from across the panel rather than from one small glyph. */
.toggle.on { border-color: var(--accent); color: var(--accent); }
.toggle.on .tick { background: var(--accent); border-color: var(--accent); color: #fff; }
.toggle:hover { border-color: var(--accent); }
/* Focus has to stay visible now that the input itself is hidden. */
.toggle input:focus-visible + .tick { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Drop target. The whole page accepts a drag, so there is no small area to
   find - the overlay only appears once something is actually being dragged. */
#drop {
  position: fixed; inset: 0; z-index: 50;
  display: none; align-items: center; justify-content: center;
  background: #000a; color: #fff; font-size: 1.2rem; text-align: center;
  pointer-events: none;
}
#drop.on { display: flex; }
#drop span {
  border: 2px dashed #fff8; border-radius: 12px; padding: 2rem 3rem; background: #0006;
}
</style>

<header>
  <h1><img src="/favicon.ico" alt="" width="20" height="20">NanoTorrent <span class="stat" id="version"></span></h1>
  <span class="stat">&darr; <b id="dl">0 B/s</b></span>
  <span class="stat">&uarr; <b id="ul">0 B/s</b></span>
  <span class="stat">DHT <b id="dht">-</b></span>
  <span class="stat"><b id="count">0</b> torrents</span>
  <select id="theme" title="{{theme}}" aria-label="{{theme}}">
    <option value="auto">{{theme_system}}</option>
    <option value="light">{{light_theme}}</option>
    <option value="dark">{{theme_dark}}</option>
  </select>
  <button class="tool" id="tb-magnet" title="{{add_magnet_link_s}}" aria-label="{{add_magnet_link_s}}">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 3h4v3H4zM12 3h4v3h-4zM4 7h4v3a2 2 0 0 0 4 0V7h4v3a6 6 0 0 1-12 0z"/></svg>
  </button>
  <button class="tool" id="tb-add" title="{{add_torrent_s}}" aria-label="{{add_torrent_s}}">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M9 4h2v5h5v2h-5v5H9v-5H4V9h5z"/></svg>
  </button>
  <span class="tool-sep"></span>
  <button class="tool" id="tb-remove" title="{{remove}}" aria-label="{{remove}}" disabled>
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 2h6v2h4v2H3V4h4zM4 7h12l-1 11H5z"/></svg>
  </button>
  <button class="tool" id="tb-resume" title="{{resume}}" aria-label="{{resume}}" disabled>
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3l12 7-12 7z"/></svg>
  </button>
  <button class="tool" id="tb-pause" title="{{pause}}" aria-label="{{pause}}" disabled>
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3h4v14H5zM11 3h4v14h-4z"/></svg>
  </button>
  <span class="stat" id="sel-count" title="{{status}}"></span>
  <span class="tool-sep"></span>
  <!-- One minute of each direction, the same pair the desktop toolbar draws.
       Not to a shared scale: upload is usually a fraction of download, and one
       scale would flatten it into a line along the bottom. -->
  <span class="chart" title="&darr;"><svg id="ch-dl" viewBox="0 0 60 100" preserveAspectRatio="none"><polyline id="ch-dl-p"/></svg><b id="ch-dl-t">-</b></span>
  <span class="chart" title="&uarr;"><svg id="ch-ul" viewBox="0 0 60 100" preserveAspectRatio="none"><polyline id="ch-ul-p"/></svg><b id="ch-ul-t">-</b></span>
  <button class="primary" id="btn-add">{{add_torrent_s}}</button>
  <button class="tool" id="btn-plugins" title="{{plugins}}" aria-label="{{plugins}}" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 11H19V7a2 2 0 0 0-2-2h-4V3.5a2.5 2.5 0 0 0-5 0V5H4a2 2 0 0 0-2 2v3.8h1.5a2.7 2.7 0 0 1 0 5.4H2V20a2 2 0 0 0 2 2h3.8v-1.5a2.7 2.7 0 0 1 5.4 0V22H17a2 2 0 0 0 2-2v-4h1.5a2.5 2.5 0 0 0 0-5z"/></svg>
  </button>
  <button class="hamburger" id="btn-prefs" title="{{preferences}}" aria-label="{{preferences}}"
          aria-controls="drawer" aria-expanded="false">&#9776;</button>
</header>

<div id="drop" aria-hidden="true"><span>{{add_torrent_s}}</span></div>
<div id="scrim"></div>
<aside id="drawer" aria-hidden="true" aria-label="{{preferences}}">
  <header>
    <h2>{{preferences}}</h2>
    <button type="button" id="drawer-close" aria-label="Close">&times;</button>
  </header>
  <div id="drawer-body"></div>
  <div id="drawer-foot">
    <span id="drawer-note"></span>
    <button type="button" class="primary" id="drawer-save" disabled>{{save_changes}}</button>
  </div>
</aside>

<main>
  <div class="tablewrap">
    <table>
      <colgroup id="cols"></colgroup>
      <thead><tr id="head">
        <th>{{name}}</th><th>{{size}}</th><th>{{progress}}</th><th>{{status}}</th>
        <th class="num">&darr;</th><th class="num">&uarr;</th>
        <th class="num">{{peers}}</th><th class="num">{{ratio}}</th><th>{{actions}}</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="empty" id="empty" hidden>{{no_torrents_yet}}</div>
</main>

<!-- A plugin's surface, drawn from /api/plugins/{name}. The shape is fixed -
     an optional upper list, a main list, a text field and some buttons - the
     same shape the desktop window draws, because it is the same state. A
     plugin cannot put arbitrary markup here; every string goes in as
     textContent. -->
<!-- Every plugin in the folder, on or off. The button answers "what do I
     have and is it running", so a disabled plugin has to appear here - it has
     no window by definition, and listing only windows would make it look like
     it did not exist. -->
<dialog id="plugs">
  <form method="dialog">
    <div class="dlg-head">{{plugins}}</div>
    <div class="dlg-body"><div id="plugs-list"></div></div>
    <div class="dlg-foot">
      <button value="cancel">{{close}}</button>
    </div>
  </form>
</dialog>

<dialog id="plug">
  <form method="dialog">
    <div class="dlg-head" id="plug-title">{{plugins}}</div>
    <div class="dlg-body">
      <select id="plug-pick" hidden></select>
      <div class="plug-list" id="plug-groups" hidden></div>
      <div class="plug-list" id="plug-rows"></div>
      <div class="plug-status" id="plug-status"></div>
      <input type="text" id="plug-input" hidden>
      <div class="plug-buttons" id="plug-buttons"></div>
    </div>
    <div class="dlg-foot">
      <button value="cancel">{{close}}</button>
    </div>
  </form>
</dialog>

<dialog id="add">
  <form method="dialog">
    <div class="dlg-head">{{add_torrent_s}}</div>
    <div class="dlg-body">
      <label>{{magnet_link}}<span class="hint"> - {{magnet_hint}}</span>
        <textarea id="add-magnet" rows="2" placeholder="magnet:?xt=urn:btih:..."></textarea>
      </label>
      <label>{{or_torrent_files}}<span class="hint"> - {{files_hint}}</span>
        <input type="file" id="add-file" multiple accept=".torrent,application/x-bittorrent">
      </label>
      <div class="row">
        <label>{{save_to}}
          <input type="text" id="add-path" placeholder="server default">
        </label>
        <button type="button" id="add-browse">{{browse_folder}}</button>
      </div>
      <label class="check"><input type="checkbox" id="add-start" checked> {{start_immediately}}</label>

      <!-- Appears once the chosen .torrent files have been read by
           /api/torrents/inspect. Same two panes as the desktop dialog: the
           batch down the left, the selected torrent's files on the right. -->
      <div class="inspect" id="add-inspect" hidden>
        <div class="inspect-queue" id="add-queue"></div>
        <div class="inspect-files">
          <div class="inspect-head" id="add-fhead"></div>
          <div class="inspect-list" id="add-files"></div>
        </div>
      </div>
    </div>
    <div class="dlg-foot">
      <button value="cancel">{{cancel}}</button>
      <button class="primary" id="add-ok" value="ok">{{add}}</button>
    </div>
  </form>
</dialog>

<dialog id="browser">
  <div class="dlg-head">{{choose_folder}}</div>
  <div class="dlg-body">
    <div id="browser-path"></div>
    <div class="row">
      <button type="button" id="browser-up">Up</button>
      <button type="button" id="browser-mkdir">{{new_folder}}</button>
    </div>
    <div id="browser-list"></div>
  </div>
  <div class="dlg-foot">
    <button type="button" id="browser-cancel">{{cancel}}</button>
    <button type="button" class="primary" id="browser-pick">{{use_this_folder}}</button>
  </div>
</dialog>

<div id="toasts"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

// --- formatting -------------------------------------------------------------
const UNITS = ["B", "KB", "MB", "GB", "TB", "PB"];
function bytes(n) {
  if (n === null || n === undefined || n < 0) return "-";
  let u = 0;
  while (n >= 1024 && u < UNITS.length - 1) { n /= 1024; u++; }
  return (u === 0 ? n : n.toFixed(2)) + " " + UNITS[u];
}
const speed = (n) => (n > 0 ? bytes(n) + "/s" : "-");
function eta(s) {
  if (s === null || s === undefined) return "-";
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m";
  if (s < 86400) return Math.floor(s / 3600) + "h";
  return Math.floor(s / 86400) + "d";
}
const STATES = {
  downloading: "Downloading", downloading_paused: "Paused", downloading_metadata: "Metadata",
  downloading_checking: "Checking", downloading_queued: "Queued",
  uploading: "Seeding", uploading_paused: "Paused", uploading_queued: "Queued",
  checking_files: "Checking", checking_resume_data: "Checking", error: "Error", unknown: "Unknown",
};

function toast(message, kind) {
  const el = document.createElement("div");
  el.className = "toast" + (kind === "info" ? " info" : "");
  el.textContent = message;                       // never innerHTML - see header
  $("toasts").append(el);
  setTimeout(() => el.remove(), 8000);
}

// --- api --------------------------------------------------------------------
// Credentials come from the browser's own Basic auth prompt, triggered by the
// 401 the server sends. No login form to build, and no token to store.
async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);
  if (!res.ok) {
    let detail = await res.text().catch(() => "");
    throw new Error(detail.trim() || (res.status + " " + res.statusText));
  }
  // Any empty body, not just 204. A 202 with nothing in it - which is what
  // "accepted, the plugin runs on its own thread" looks like - used to reach
  // res.json() and throw "Unexpected end of JSON input", killing the caller
  // mid-flow. That is how the plugin panel came up blank.
  if (res.status === 204 || res.headers.get("content-length") === "0") return null;
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

// --- torrent list -----------------------------------------------------------
function actionButton(text, cls, onClick) {
  const b = document.createElement("button");
  b.textContent = text;
  if (cls) b.className = cls;
  b.addEventListener("click", onClick);
  return b;
}

function cell(row, text, cls) {
  const td = row.insertCell();
  if (cls) td.className = cls;
  if (text !== undefined) td.textContent = text;
  return td;
}

async function act(fn) {
  try { await fn(); await refresh(); }
  catch (e) { toast(e.message); }
}

function renderRows(list) {
  const body = $("rows");
  body.textContent = "";
  $("empty").hidden = list.length > 0;

  for (const t of list) {
    const row = body.insertRow();
    row.dataset.hash = t.info_hash;
    row.addEventListener("click", (ev) => {
      // Not when the click was meant for one of the row's own buttons.
      if (ev.target.closest("button")) return;
      clickRow(t.info_hash, ev);
    });
    const name = cell(row, t.name, "name");
    name.title = t.name + "\n" + t.save_path;

    cell(row, bytes(t.size), "num");

    const prog = cell(row);
    const bar = document.createElement("div");
    bar.className = "bar";
    const fill = document.createElement("i");
    fill.style.width = Math.round(t.progress * 100) + "%";
    const label = document.createElement("span");
    label.textContent = (t.progress * 100).toFixed(1) + "%";
    bar.append(fill, label);
    prog.append(bar);

    const state = cell(row);
    const s = document.createElement("div");
    s.className = "state" + (t.error ? " err" : t.state === "uploading" ? " up" : "");
    s.textContent = t.error ? "Error" : STATES[t.state] || t.state;
    if (t.error) s.title = t.error;
    state.append(s);
    if (!t.paused && t.eta_seconds !== null) {
      const e = document.createElement("div");
      e.className = "state";
      e.textContent = "ETA " + eta(t.eta_seconds);
      state.append(e);
    }

    cell(row, speed(t.download_rate), "num");
    cell(row, speed(t.upload_rate), "num");
    cell(row, t.peers + " (" + t.peers_total + ")", "num");
    cell(row, t.ratio.toFixed(2), "num");

    // `act` opts out of the ellipsis clipping every other cell wants: three
    // buttons are not text and must not be cut in half.
    const actions = cell(row, undefined, "act");
    const box = document.createElement("div");
    box.className = "actions";
    box.append(
      t.paused
        ? actionButton("Resume", "", () => act(() => api("POST", `/api/torrents/${t.info_hash}/resume`)))
        : actionButton("Pause", "", () => act(() => api("POST", `/api/torrents/${t.info_hash}/pause`))),
      // Points the torrent at data that has already been moved; it does not
      // move anything. The browser opens at the current save path because the
      // new location is usually a sibling of the old one.
      actionButton("Location", "", () => {
        openBrowser(t.save_path || null, (path) => {
          act(() => api("POST", `/api/torrents/${t.info_hash}/location`, { path }));
        });
      }),
      actionButton("Remove", "danger", () => {
        // Two questions, because the second one is unrecoverable.
        if (!confirm(`Remove "${t.name}" from NanoTorrent?`)) return;
        const withData = confirm("Also DELETE the downloaded files from disk?\n\nOK = delete files, Cancel = keep them.");
        act(() => api("DELETE", `/api/torrents/${t.info_hash}?delete_files=${withData}`));
      }),
    );
    actions.append(box);
  }
}

// Translations for the strings this script builds. Injected by the server
// so the page never renders English first and repaints.
const T = {{__T__}};

// --- preferences drawer -----------------------------------------------------
// Rendered from /api/settings, which describes every preference and the control
// it needs. Nothing about the individual settings is written here: the server
// owns the list, the types and the validation, so a setting added to the CLI
// registry shows up in this drawer with no change to this file.
let prefsLoaded = false;
// name -> value, for the controls touched since the drawer was filled.
const pending = new Map();

function prefControl(s) {
  const wrap = document.createElement("div");
  wrap.className = "pref";

  const id = "pref-" + s.name;
  const label = document.createElement("label");
  label.htmlFor = id;
  label.textContent = s.description;
  wrap.append(label);

  const row = document.createElement("div");
  row.className = "row";
  let input;

  if (s.kind === "bool") {
    input = document.createElement("input");
    input.type = "checkbox";
    input.checked = s.value === "true";

    // The description moves onto the button itself, so it is not printed
    // twice, and the button carries the whole hit area.
    label.remove();
    const toggle = document.createElement("label");
    toggle.className = "toggle" + (input.checked ? " on" : "");
    const tick = document.createElement("span");
    tick.className = "tick";
    tick.textContent = "\u2713";
    const text = document.createElement("span");
    text.textContent = s.description;
    toggle.append(input, tick, text);
    input.addEventListener("change", () => {
      toggle.classList.toggle("on", input.checked);
    });
    row.append(toggle);
  } else if (s.kind === "choice") {
    input = document.createElement("select");
    // A setting that has never been written reads back as "(unset)", which
    // matches no option and would leave the box blank - looking broken rather
    // than unset. Show it, disabled, so it cannot be chosen deliberately.
    if (!s.options.includes(s.value)) {
      const ph = document.createElement("option");
      ph.value = s.value; ph.textContent = s.value; ph.disabled = true;
      input.append(ph);
    }
    for (let i = 0; i < s.options.length; i++) {
      const opt = document.createElement("option");
      opt.value = s.options[i];
      // Labels differ from values where the value is a code: the language
      // picker lists "Nederlands", not "nl-NL".
      opt.textContent = (s.labels && s.labels[i]) || s.options[i];
      input.append(opt);
    }
    input.value = s.value;
  } else if (s.kind === "int") {
    input = document.createElement("input");
    input.type = "number";
    if (s.min !== undefined) input.min = s.min;
    if (s.max !== undefined) input.max = s.max;
    // "(unset)" is not a number; leave the box empty rather than showing it.
    input.value = /^-?\d+$/.test(s.value) ? s.value : "";
  } else {
    input = document.createElement("input");
    input.type = "text";
    input.value = s.value === "(unset)" ? "" : s.value;
  }
  input.id = id;
  if (s.kind !== "bool") row.append(input);

  if (s.unit) {
    const u = document.createElement("span");
    u.className = "unit";
    u.textContent = s.unit;
    row.append(u);
  }
  // A folder setting gets the same picker the Add dialog uses.
  if (s.kind === "dir") {
    const browse = document.createElement("button");
    browse.type = "button";
    browse.textContent = T.browse_folder;
    browse.addEventListener("click", () => {
      openBrowser(input.value || null, (path) => {
        input.value = path;
        input.dispatchEvent(new Event("change"));
      });
    });
    row.append(browse);
  }
  wrap.append(row);
  // The CLI name, on hover rather than on screen: `nanotorrent --set <name>`
  // is worth being able to find, and worth nothing as a line of grey monospace
  // under every one of forty settings.
  wrap.title = s.name;

  // Edits are collected, not sent: Save writes them, applies them and reloads.
  // Per-control saving meant a half-changed configuration was live the whole
  // time it took to fill the panel in.
  const read = () => (s.kind === "bool" ? String(input.checked) : input.value);
  const initial = read();
  function changed() {
    const now = read();
    if (now === initial) pending.delete(s.name);
    else pending.set(s.name, now);
    $("drawer-save").disabled = pending.size === 0;
    $("drawer-note").textContent = pending.size
      ? pending.size + " " + T.changes_to_save
      : "";
  }
  input.addEventListener("change", changed);
  input.addEventListener("input", changed);
  return wrap;
}

async function loadPrefs() {
  const body = $("drawer-body");
  body.textContent = T.loading;
  try {
    const sections = await api("GET", "/api/settings");
    body.textContent = "";
    for (const sec of sections) {
      const h = document.createElement("h3");
      h.textContent = sec.name;
      body.append(h);
      for (const s of sec.settings) body.append(prefControl(s));
    }
    prefsLoaded = true;
    pending.clear();
    $("drawer-save").disabled = true;
    $("drawer-note").textContent = "";
  } catch (e) {
    body.textContent = e.message;
  }
}

// Writes every pending change, asks the session to pick them up, then reloads.
//
// Reloading rather than patching the page in place: a language change has to
// redraw every caption, and a theme change the whole palette. One reload is
// both simpler and more obviously correct than replaying each of those.
async function savePrefs() {
  const btn = $("drawer-save");
  btn.disabled = true;
  $("drawer-note").textContent = T.saving;

  for (const [name, value] of pending) {
    try {
      await api("POST", "/api/settings", { name, value });
    } catch (e) {
      // Stop on the first rejection, with the offending field named: carrying
      // on would leave some of the panel applied and some not.
      toast(name + ": " + e.message);
      $("drawer-note").textContent = "";
      btn.disabled = false;
      return;
    }
  }

  try {
    await api("POST", "/api/settings/apply");
  } catch (e) {
    toast(e.message);
  }
  location.reload();
}
$("drawer-save").addEventListener("click", savePrefs);

function openPrefs() {
  $("drawer").classList.add("open");
  $("scrim").classList.add("open");
  $("drawer").setAttribute("aria-hidden", "false");
  $("btn-prefs").setAttribute("aria-expanded", "true");
  if (!prefsLoaded) loadPrefs();
}
function closePrefs() {
  $("drawer").classList.remove("open");
  $("scrim").classList.remove("open");
  $("drawer").setAttribute("aria-hidden", "true");
  $("btn-prefs").setAttribute("aria-expanded", "false");
}
$("btn-prefs").addEventListener("click", openPrefs);
$("drawer-close").addEventListener("click", closePrefs);
$("scrim").addEventListener("click", closePrefs);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && $("drawer").classList.contains("open")) closePrefs();
});
// Deep link, so the drawer can be bookmarked and linked to.
if (location.hash === "#preferences") openPrefs();

// --- polling ----------------------------------------------------------------
let failures = 0;
async function refresh() {
  try {
    const [info, list, errs] = await Promise.all([
      api("GET", "/api/session"),
      api("GET", "/api/torrents"),
      api("GET", "/api/errors"),
    ]);
    $("version").textContent = "v" + info.version;
    $("dl").textContent = speed(info.download_rate);
    $("ul").textContent = speed(info.upload_rate);
    $("dht").textContent = info.dht_nodes === null ? "-" : info.dht_nodes;
    $("count").textContent = info.torrents;
    pushRates(info.download_rate, info.upload_rate);
    LAST_TORRENTS = list;
    renderRows(list);
    // Torrents may have been removed underneath the selection.
    const alive = new Set(list.map((t) => t.info_hash));
    for (const h of [...selectedHashes]) if (!alive.has(h)) selectedHashes.delete(h);
    paintSelection();
    // The session error queue drains on read, so anything here is new.
    for (const e of errs.errors) toast(e);
    failures = 0;
  } catch (e) {
    // Only complain once per outage, or a closed laptop lid produces a wall
    // of identical toasts.
    if (failures++ === 0) toast(T.lost_contact + ": " + e.message);
  }
}

// --- folder browser ---------------------------------------------------------
let browsingPath = null;
let onFolderPicked = null;

async function browseTo(path) {
  try {
    const listing = await api("GET", "/api/fs/list?path=" + encodeURIComponent(path));
    browsingPath = listing.path;
    $("browser-path").textContent = listing.path;
    $("browser-up").disabled = !listing.parent;
    $("browser-up").dataset.parent = listing.parent || "";

    const box = $("browser-list");
    box.textContent = "";
    const dirs = listing.entries.filter((e) => e.is_dir);
    if (!dirs.length) {
      const none = document.createElement("div");
      none.style.padding = ".6rem";
      none.style.color = "var(--muted)";
      none.textContent = T.no_subfolders;
      box.append(none);
    }
    for (const d of dirs) {
      box.append(actionButton("\u{1F4C1}  " + d.name, "", () => browseTo(d.path)));
    }
  } catch (e) {
    toast(e.message);
  }
}

async function openBrowser(startPath, cb) {
  onFolderPicked = cb;
  $("browser").showModal();
  if (startPath) { await browseTo(startPath); return; }
  try {
    const roots = await api("GET", "/api/fs/roots");
    await browseTo(roots.downloads);
  } catch (e) { toast(e.message); }
}

$("browser-up").addEventListener("click", (e) => {
  const parent = e.currentTarget.dataset.parent;
  if (parent) browseTo(parent);
});
$("browser-mkdir").addEventListener("click", async () => {
  const name = prompt("Name for the new folder:");
  if (!name) return;
  try {
    const sep = browsingPath.includes("\\") ? "\\" : "/";
    const target = browsingPath.replace(/[\\/]$/, "") + sep + name;
    const listing = await api("POST", "/api/fs/mkdir", { path: target });
    await browseTo(listing.path);
    toast("Created " + listing.path, "info");
  } catch (e) { toast(e.message); }
});
$("browser-cancel").addEventListener("click", () => $("browser").close());
$("browser-pick").addEventListener("click", () => {
  if (onFolderPicked && browsingPath) onFolderPicked(browsingPath);
  $("browser").close();
});

// --- add dialog -------------------------------------------------------------
$("btn-add").addEventListener("click", () => {
  $("add-magnet").value = "";
  $("add-file").value = "";
  $("add-path").value = "";
  $("add-start").checked = true;
  clearInspection();
  $("add").showModal();
});

$("add-browse").addEventListener("click", () => {
  openBrowser($("add-path").value || null, (p) => { $("add-path").value = p; });
});

const readAsBase64 = (file) => new Promise((resolve, reject) => {
  const r = new FileReader();
  // The data: URL carries a "...;base64," prefix the API must not receive.
  r.onload = () => resolve(String(r.result).split(",", 2)[1]);
  r.onerror = () => reject(new Error("could not read " + file.name));
  r.readAsDataURL(file);
});

// --- torrent inspection -----------------------------------------------------
// Chosen .torrent files are read by the server (/api/torrents/inspect) so the
// remote can show the same name, size and file list the desktop dialog does,
// and untick files before adding. The server reuses the desktop's own parser,
// so the two always agree about what a torrent contains.
//
// Magnets are not inspected: there is nothing to look at until their metadata
// resolves, which is exactly why the desktop resolves them first and this does
// not try to.
let inspected = [];   // { b64, name, total_size, files, included[] }
let selected = 0;

function clearInspection() {
  inspected = [];
  selected = 0;
  $("add-inspect").hidden = true;
  $("add-queue").textContent = "";
  $("add-files").textContent = "";
  $("add-fhead").textContent = "";
}

function renderQueue() {
  const q = $("add-queue");
  q.textContent = "";
  // One pane is pointless for a single torrent - its name is already in the
  // header below. Collapse the column too, or the file list keeps a 190px
  // gap beside it where the queue would have been.
  const single = inspected.length < 2;
  q.hidden = single;
  $("add-inspect").style.gridTemplateColumns = single ? "1fr" : "";
  if (single) return;
  inspected.forEach((t, i) => {
    const item = document.createElement("div");
    item.className = "q-item" + (i === selected ? " sel" : "");
    const name = document.createElement("span");
    name.className = "q-name";
    name.textContent = t.name;                    // never innerHTML - see header
    const size = document.createElement("span");
    size.className = "q-size";
    size.textContent = bytes(t.total_size);
    item.append(name, size);
    item.addEventListener("click", () => { selected = i; renderQueue(); renderFiles(); });
    q.append(item);
  });
}

function renderFiles() {
  const t = inspected[selected];
  const list = $("add-files");
  list.textContent = "";
  if (!t) { $("add-fhead").textContent = ""; return; }

  const on = t.included.filter(Boolean).length;
  $("add-fhead").textContent =
    `${t.name} - ${bytes(t.total_size)}, ${on}/${t.files.length} file${t.files.length > 1 ? "s" : ""}`;

  t.files.forEach((f, i) => {
    const row = document.createElement("div");
    row.className = "f-item";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = t.included[i];
    cb.addEventListener("change", () => {
      t.included[i] = cb.checked;
      // Re-render for the count in the header; the list is small enough that
      // rebuilding it is cheaper to write than to patch in place.
      renderFiles();
    });
    const name = document.createElement("span");
    name.className = "f-name";
    name.textContent = f.path;                    // attacker-controlled
    name.title = f.path;
    const size = document.createElement("span");
    size.className = "f-size";
    size.textContent = bytes(f.size);
    row.append(cb, name, size);
    list.append(row);
  });
}

$("add-file").addEventListener("change", async () => {
  const files = [...$("add-file").files];
  clearInspection();
  if (!files.length) return;

  try {
    const items = await Promise.all(
      files.map(async (f) => ({ torrent_file: await readAsBase64(f) })),
    );
    const metas = await api("POST", "/api/torrents/inspect", items.length === 1 ? items[0] : items);
    inspected = metas.map((m, i) => ({
      b64: items[i].torrent_file,
      name: m.name,
      total_size: m.total_size,
      files: m.files,
      included: m.files.map(() => true),
    }));
    $("add-inspect").hidden = false;
    renderQueue();
    renderFiles();
  } catch (e) {
    // Leave the picker as it is so the mistake is visible and fixable.
    clearInspection();
    toast(e.message);
  }
});

$("add").addEventListener("close", async () => {
  if ($("add").returnValue !== "ok") return;
  // Blank lines are what you get from pasting a list, not an error.
  const magnets = $("add-magnet").value.split("\n").map(m => m.trim()).filter(Boolean);
  const files = [...$("add-file").files];
  const savePath = $("add-path").value.trim();

  if (!magnets.length && !files.length) { toast(T.give_magnet_or_file); return; }
  if (magnets.length && files.length) { toast(T.give_not_both); return; }

  // Every entry carries the same save path and start flag - the form only
  // offers one of each, and the endpoint takes them per torrent.
  const common = { start: $("add-start").checked };
  if (savePath) common.save_path = savePath;

  try {
    const items = magnets.length
      ? magnets.map(magnet => ({ ...common, magnet }))
      : inspected.map(t => {
          // Each file's own index, NOT its position in this list: padding
          // files are filtered out of the inspect response, so the two are no
          // longer the same. Omitted when everything is ticked - null means
          // "all", which is not the same as listing them.
          const keep = t.included.flatMap((on, i) => (on ? [t.files[i].index] : []));
          const item = { ...common, torrent_file: t.b64 };
          if (keep.length !== t.files.length) item.only_files = keep;
          return item;
        });

    if (!items.length) { toast(T.nothing_to_add); return; }
    if (items.some(i => i.only_files && !i.only_files.length)) {
      toast(T.all_files_unticked);
      return;
    }

    // One request for the batch: the endpoint validates them all before
    // adding any, so a bad entry cannot half-apply the list.
    await api("POST", "/api/torrents", items.length === 1 ? items[0] : items);

    // 202: accepted, not added. A magnet has to resolve its metadata first,
    // so say "queued" rather than claiming it is downloading.
    const n = items.length;
    toast(
      magnets.length
        ? `${n} magnet${n > 1 ? "s" : ""} queued - resolving metadata...`
        : `${n} torrent${n > 1 ? "s" : ""} added.`,
      "info",
    );
    await refresh();
  } catch (e) { toast(e.message); }
});

// --- theme ------------------------------------------------------------------
// Mirrors the desktop's View > Theme: auto follows the OS, light and dark
// override it. `?theme=` wins for one page load without touching the stored
// preference, which is what makes both palettes screenshot-testable.
function applyTheme(value) {
  if (value === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", value);
}
{
  const stored = localStorage.getItem("theme") || "auto";
  const forced = new URLSearchParams(location.search).get("theme");
  const initial = ["auto", "light", "dark"].includes(forced) ? forced : stored;
  $("theme").value = initial;
  applyTheme(initial);
  $("theme").addEventListener("change", (e) => {
    applyTheme(e.target.value);
    localStorage.setItem("theme", e.target.value);
  });
}

// Poll interval in seconds; `?refresh=0` freezes the page on one snapshot.
//
// That switch is also what makes this page testable headlessly: Chromium's
// --virtual-time-budget waits for the network to fall idle before capturing,
// and a page that re-polls every two seconds never does, so a screenshot run
// hangs until it is killed.
const REFRESH = Number(new URLSearchParams(location.search).get("refresh") ?? 2);
refresh();
if (REFRESH > 0) setInterval(refresh, REFRESH * 1000);

// --- plugins ---------------------------------------------------------------
//
// The same surface the desktop window shows, from the same state: the plugin
// host holds it, the window and this both render it and post events back. A
// .rhai plugin needs no changes and no extra permission to appear here.
let plugCurrent = null;
let plugTimer = 0;

function plugRow(r, kind) {
  const el = document.createElement("div");
  el.className = "plug-row" + (r.selected ? " sel" : "");
  const t = document.createElement("span");
  t.textContent = r.title;                        // never innerHTML - see header
  el.append(t);
  if (r.subtitle) {
    const s = document.createElement("span");
    s.className = "sub";
    s.textContent = r.subtitle;
    el.append(s);
  }
  el.onclick = () => plugSend({ kind, id: r.id });
  return el;
}

async function plugSend(body) {
  if (!plugCurrent) return;
  if (body.kind === "button") body.input = $("plug-input").value;
  await api("POST", `/api/plugins/${encodeURIComponent(plugCurrent)}/event`, body);
  // The plugin runs on the host's thread and answers by updating its surface,
  // so poll briefly rather than expecting the POST to carry a result.
  setTimeout(plugDraw, 150);
  setTimeout(plugDraw, 600);
}

async function plugDraw() {
  if (!plugCurrent) return;
  let s;
  try {
    s = await api("GET", `/api/plugins/${encodeURIComponent(plugCurrent)}`);
  } catch (e) {
    return;
  }
  $("plug-title").textContent = s.title || s.name;
  $("plug-status").textContent = s.status;

  const groups = $("plug-groups");
  groups.textContent = "";
  groups.hidden = s.groups.length === 0;
  for (const g of s.groups) groups.append(plugRow(g, "group"));

  const rows = $("plug-rows");
  rows.textContent = "";
  for (const r of s.rows) rows.append(plugRow(r, "row"));

  const input = $("plug-input");
  input.hidden = !s.placeholder;
  input.placeholder = s.placeholder || "";

  const buttons = $("plug-buttons");
  buttons.textContent = "";
  for (const [id, label] of s.buttons) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    b.onclick = () => plugSend({ kind: "button", id });
    buttons.append(b);
  }
}

async function plugOpen(name) {
  plugCurrent = name;
  $("plug-input").value = "";
  $("plug").showModal();
  // Its chance to fill the surface before it is looked at, exactly as opening
  // the desktop window does.
  await plugSend({ kind: "opened" });
  await plugDraw();
  clearInterval(plugTimer);
  plugTimer = setInterval(plugDraw, 2000);
}

$("plug").addEventListener("close", () => {
  clearInterval(plugTimer);
  plugTimer = 0;
  plugCurrent = null;
});

// The button only exists if something is behind it: plugins are off by
// default, and most people have none.
async function plugScan() {
  let list = [];
  try {
    list = await api("GET", "/api/plugins");
  } catch (e) {
    return;
  }
  $("btn-plugins").hidden = false;
  // The surface dialog's own picker only lists what can actually be opened.
  const openable = list.filter((p) => p.has_window);
  const pick = $("plug-pick");
  pick.hidden = openable.length < 2;
  pick.textContent = "";
  for (const p of openable) {
    const o = document.createElement("option");
    o.value = p.name;
    o.textContent = p.title || p.name;
    pick.append(o);
  }
  pick.onchange = () => plugOpen(pick.value);
}
$("btn-plugins").onclick = () => { $("plugs").showModal(); drawPlugList(); };
plugScan();

// --- toolbar, selection and charts ------------------------------------------
//
// The desktop's toolbar acts on the selected torrent, so this needs a
// selection to act on - the table had none, only per-row buttons.
// A set, not one hash: the toolbar acts on everything selected, the way the
// desktop list does. Plain click selects one, ctrl/cmd-click adds or removes
// one, shift-click takes the range from the last row clicked.
const selectedHashes = new Set();
let anchorHash = null;

function paintSelection() {
  for (const tr of document.querySelectorAll("#rows tr")) {
    tr.classList.toggle("sel", selectedHashes.has(tr.dataset.hash));
  }
  syncToolbar();
}

function chosen() {
  return (LAST_TORRENTS || []).filter((t) => selectedHashes.has(t.info_hash));
}

function clickRow(hash, ev) {
  const order = (LAST_TORRENTS || []).map((t) => t.info_hash);

  if (ev.shiftKey && anchorHash && order.includes(anchorHash)) {
    const a = order.indexOf(anchorHash);
    const b = order.indexOf(hash);
    selectedHashes.clear();
    for (let i = Math.min(a, b); i <= Math.max(a, b); i++) selectedHashes.add(order[i]);
  } else if (ev.ctrlKey || ev.metaKey) {
    if (selectedHashes.has(hash)) selectedHashes.delete(hash);
    else selectedHashes.add(hash);
    anchorHash = hash;
  } else {
    selectedHashes.clear();
    selectedHashes.add(hash);
    anchorHash = hash;
  }
  paintSelection();
}

function syncToolbar() {
  const picked = chosen();
  const n = picked.length;
  $("tb-remove").disabled = n === 0;
  // Enabled when it would do something to at least one of them: with a mixed
  // selection both buttons are live, and each acts only on the rows it applies
  // to rather than toggling everything.
  $("tb-resume").disabled = !picked.some((t) => t.paused);
  $("tb-pause").disabled = !picked.some((t) => !t.paused);
  $("sel-count").textContent = n > 1 ? n + "" : "";
}

// Kept so the toolbar can ask about the selected torrent without another
// round trip - refresh() already has the list.
let LAST_TORRENTS = [];

$("tb-magnet").onclick = () => { $("add").showModal(); $("add-magnet").focus(); };
$("tb-add").onclick = () => { $("add").showModal(); $("add-file").focus(); };
// Each acts on the rows it applies to, so a mixed selection does the sensible
// thing rather than toggling every row to the opposite of what it was.
$("tb-resume").onclick = () =>
  act(() => Promise.all(chosen().filter((t) => t.paused)
    .map((t) => api("POST", `/api/torrents/${t.info_hash}/resume`))));
$("tb-pause").onclick = () =>
  act(() => Promise.all(chosen().filter((t) => !t.paused)
    .map((t) => api("POST", `/api/torrents/${t.info_hash}/pause`))));
$("tb-remove").onclick = () => {
  const picked = chosen();
  if (!picked.length) return;
  // Same two prompts the row's own Remove button asks, rather than a third
  // wording for the same act.
  const what = picked.length === 1 ? `"${picked[0].name}"` : picked.length + " torrents";
  if (!confirm(`Remove ${what} from NanoTorrent?`)) return;
  const withData = confirm("Also DELETE the downloaded files from disk?\n\nOK = delete files, Cancel = keep them.");
  act(() => Promise.all(picked.map((t) =>
    api("DELETE", `/api/torrents/${t.info_hash}?delete_files=${withData}`))));
};

// --- charts -----------------------------------------------------------------
// One minute at the refresh interval, the same window the desktop keeps.
const SPARK = 60;
const hist = { dl: [], ul: [] };

function spark(id, series) {
  const peak = Math.max(1, ...series);
  // Each series scales to its own peak. 100 is the viewBox height; y is
  // inverted because SVG counts down from the top.
  const step = 60 / Math.max(1, SPARK - 1);
  // Inset top and bottom: at zero the line used to sit on the viewBox edge
  // with half its stroke clipped, so an idle chart looked like a broken one.
  const pts = series.map((v, i) => `${(i * step).toFixed(1)},${(96 - (v / peak) * 92).toFixed(1)}`);
  $(id).setAttribute("points", pts.join(" "));
}

function pushRates(down, up) {
  hist.dl.push(down); hist.ul.push(up);
  while (hist.dl.length > SPARK) hist.dl.shift();
  while (hist.ul.length > SPARK) hist.ul.shift();
  spark("ch-dl-p", hist.dl);
  spark("ch-ul-p", hist.ul);
  $("ch-dl-t").textContent = speed(down);
  $("ch-ul-t").textContent = speed(up);
}

// --- column widths ----------------------------------------------------------
// Stored on the server, in the same table the desktop list uses, so they follow
// the person rather than one browser's localStorage.
//
// Designed widths match the desktop's for the columns that mean the same
// thing; Progress and Actions have no desktop counterpart at these positions.
// Name (index 0) is deliberately null: with table-layout:fixed the columns
// that have no width absorb whatever is left over, so on a wide screen the
// slack goes to the torrent name instead of being shared out into eight
// columns of whitespace. A width the user drags onto it wins, as it should.
const COL_DEFAULTS = [null, 90, 130, 110, 90, 90, 80, 60, 250];

async function loadColumns() {
  let saved = {};
  try {
    saved = (await api("GET", "/api/columns")) || {};
  } catch (e) {
    // A width is a preference; failing to read one is not worth a toast.
  }
  const cg = $("cols");
  cg.textContent = "";
  COL_DEFAULTS.forEach((def, i) => {
    const c = document.createElement("col");
    const w = saved[i] || def;
    if (w) c.style.width = w + "px";
    cg.append(c);
  });
  installGrips();
}

function installGrips() {
  const cols = $("cols").children;
  document.querySelectorAll("#head th").forEach((th, i) => {
    if (i >= cols.length - 1) return;         // nothing to drag past the last
    if (th.querySelector(".grip")) return;
    const grip = document.createElement("div");
    grip.className = "grip";
    grip.addEventListener("mousedown", (ev) => {
      ev.preventDefault();
      const startX = ev.clientX;
      const startW = cols[i].getBoundingClientRect().width;
      document.body.classList.add("resizing");

      const move = (e) => {
        // 40px floor: narrower than this and the header caption is gone, so
        // there is nothing left to grab or read.
        cols[i].style.width = Math.max(40, startW + e.clientX - startX) + "px";
      };
      const up = () => {
        document.removeEventListener("mousemove", move);
        document.removeEventListener("mouseup", up);
        document.body.classList.remove("resizing");
        api("POST", "/api/columns", {
          column: i,
          width: Math.round(cols[i].getBoundingClientRect().width),
        }).catch(() => {});
      };
      document.addEventListener("mousemove", move);
      document.addEventListener("mouseup", up);
    });
    th.append(grip);
  });
}
loadColumns();

// --- plugin index -----------------------------------------------------------
//
// The button opens this, not a surface: most plugins have no window, and the
// question being asked is "what do I have and is it on".
function plugNote(p) {
  if (p.error) return ["err", p.error];
  if (p.needs_approval) {
    return ["warn", (T.plugins_needs_approval || "Waiting for approval") +
      (p.permissions.length ? " - " + p.permissions.join(", ") : "")];
  }
  if (!p.enabled) return ["", T.disabled || "Off"];
  if (p.permissions.length) {
    return ["", (T.plugins_access || "Access") + ": " + p.permissions.join(", ")];
  }
  return ["", ""];
}

async function drawPlugList() {
  const box = $("plugs-list");
  box.textContent = "";
  let list = [];
  try {
    list = await api("GET", "/api/plugins");
  } catch (e) {
    toast(e.message);
    return;
  }
  if (!list.length) {
    const p = document.createElement("div");
    p.className = "pl-note";
    p.textContent = T.plugins_none || "No plugins installed.";
    box.append(p);
    return;
  }

  for (const p of list) {
    const row = document.createElement("div");
    row.className = "pl-row";

    const on = document.createElement("input");
    on.type = "checkbox";
    on.checked = p.enabled;
    on.title = T.plugins || "Plugins";
    on.onchange = async () => {
      on.disabled = true;
      try {
        await api("POST", `/api/plugins/${encodeURIComponent(p.name)}/enabled`,
                  { enabled: on.checked });
      } catch (e) {
        toast(e.message);
        on.checked = !on.checked;
      }
      on.disabled = false;
      // The host reloads, so what a plugin reports changes a moment later.
      setTimeout(drawPlugList, 400);
      setTimeout(plugScan, 600);
    };

    const main = document.createElement("div");
    main.className = "pl-main";
    const nm = document.createElement("div");
    nm.className = "pl-name";
    nm.textContent = p.title || p.name;      // never innerHTML - see header
    main.append(nm);
    const [cls, note] = plugNote(p);
    if (note) {
      const n = document.createElement("div");
      n.className = "pl-note" + (cls ? " " + cls : "");
      n.textContent = note;
      main.append(n);
    }

    row.append(on, main);

    // Only a running plugin that has declared a window has anything to open.
    if (p.has_window) {
      const open = document.createElement("button");
      open.type = "button";
      open.textContent = T.open || "Open";
      open.onclick = () => { $("plugs").close(); plugOpen(p.name); };
      row.append(open);
    }
    box.append(row);
  }
}

// --- chart geometry ---------------------------------------------------------
// Shares the desktop's two keys and its 48-320 range, so a chart is the same
// width in both places rather than merely a similar size.
let CHART_LIMITS = { min: 48, max: 320, default: 96 };

async function loadCharts() {
  let c;
  try {
    c = await api("GET", "/api/charts");
  } catch (e) {
    return;
  }
  CHART_LIMITS = { min: c.min, max: c.max, default: c.default };
  $("ch-dl").style.width = c.down + "px";
  $("ch-ul").style.width = c.up + "px";
  installChartGrip("ch-dl", "down");
  installChartGrip("ch-ul", "up");
}

function installChartGrip(svgId, which) {
  const svg = $(svgId);
  const box = svg.parentElement;
  if (box.querySelector(".cgrip")) return;
  const grip = document.createElement("div");
  grip.className = "cgrip";
  // Sits at the right-hand edge of this chart's own box.
  grip.style.left = "";
  grip.style.right = "auto";
  const place = () => { grip.style.left = (svg.offsetLeft + svg.offsetWidth - 8) + "px"; };
  place();

  grip.addEventListener("mousedown", (ev) => {
    ev.preventDefault();
    const startX = ev.clientX;
    const startW = svg.getBoundingClientRect().width;
    document.body.classList.add("resizing");
    const move = (e) => {
      const w = Math.min(CHART_LIMITS.max,
                Math.max(CHART_LIMITS.min, startW + e.clientX - startX));
      svg.style.width = w + "px";
      place();
    };
    const up = () => {
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
      document.body.classList.remove("resizing");
      api("POST", "/api/charts", {
        which,
        width: Math.round(svg.getBoundingClientRect().width),
      }).catch(() => {});
    };
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
  });

  // Double-click resets this one to the default, like the desktop's.
  svg.addEventListener("dblclick", () => {
    svg.style.width = CHART_LIMITS.default + "px";
    place();
    api("POST", "/api/charts", { which, width: CHART_LIMITS.default }).catch(() => {});
  });

  box.append(grip);
}
loadCharts();

// --- drag and drop ----------------------------------------------------------
//
// Multi-torrent adding already worked through the file picker - batch inspect,
// per-torrent file selection, one request for the lot. What it lacked was the
// obvious way to reach it on a web page. Dropping files hands them to the very
// same picker, so there is one code path and the batch panes come up exactly
// as they do when the files are chosen by hand.
(() => {
  const overlay = $("drop");
  let depth = 0;                    // dragenter/leave fire per child element

  const hasFiles = (e) =>
    e.dataTransfer && [...e.dataTransfer.types].includes("Files");

  window.addEventListener("dragenter", (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    depth++;
    overlay.classList.add("on");
  });
  window.addEventListener("dragover", (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();                       // or the browser opens the file
    e.dataTransfer.dropEffect = "copy";
  });
  window.addEventListener("dragleave", () => {
    if (--depth <= 0) { depth = 0; overlay.classList.remove("on"); }
  });

  window.addEventListener("drop", (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    depth = 0;
    overlay.classList.remove("on");

    const dropped = [...e.dataTransfer.files]
      .filter((f) => f.name.toLowerCase().endsWith(".torrent"));
    if (!dropped.length) {
      toast(T.give_magnet_or_file || "Drop .torrent files.");
      return;
    }

    // Hand them to the picker rather than re-implementing the flow: assigning
    // a DataTransfer's FileList is the one supported way to fill a file input,
    // and the change event then runs the existing batch inspection.
    const dt = new DataTransfer();
    for (const f of dropped) dt.items.add(f);
    const picker = $("add-file");
    picker.files = dt.files;

    $("add-magnet").value = "";
    if (!$("add").open) $("add").showModal();
    picker.dispatchEvent(new Event("change"));
  });
})();
