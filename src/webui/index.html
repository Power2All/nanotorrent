<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NanoTorrent</title>
<!--
  The web remote. One file, no build step, embedded in the binary with
  include_str! - same approach as lang/*.json and res/flags/*.png.

  Deliberately a REMOTE, not a second full client: add, watch, pause, resume,
  remove, set a torrent's location, and pick a folder on the machine
  NanoTorrent runs on. The desktop UI keeps the things that only make sense
  sitting in front of it.

  Two rules worth keeping if you edit this:

  1. Never innerHTML anything that came from the server. Torrent names come out
     of .torrent files written by strangers, so every one of them is hostile
     input. textContent everywhere.
  2. No external resources. This has to work on a LAN with no internet, and the
     CSP below blocks them anyway.
-->
<style>
/* Light is the base palette; dark redefines only the tokens. Three states, to
   mirror the desktop's View > Theme menu: no data-theme attribute follows the
   OS, and an explicit one wins in both directions. */
:root {
  color-scheme: light dark;
  --bg: #ffffff; --fg: #1a1a1a; --muted: #6a6a6a; --line: #e0e0e0;
  --panel: #f6f6f6; --accent: #0a66c2; --bar: #0a66c2; --bar-bg: #e4e4e4;
  --danger: #b3261e; --ok: #1a7f37;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #1e1e1e; --fg: #e8e8e8; --muted: #9a9a9a; --line: #333;
    --panel: #262626; --accent: #4da3ff; --bar: #2f6fb5; --bar-bg: #3a3a3a;
    --danger: #f2705f; --ok: #4ac26b;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1e1e1e; --fg: #e8e8e8; --muted: #9a9a9a; --line: #333;
  --panel: #262626; --accent: #4da3ff; --bar: #2f6fb5; --bar-bg: #3a3a3a;
  --danger: #f2705f; --ok: #4ac26b;
}
:root[data-theme="light"] { color-scheme: light; }
select {
  font: inherit; padding: .3rem .4rem; border: 1px solid var(--line);
  border-radius: 6px; background: var(--bg); color: var(--fg);
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 14px/1.45 system-ui, "Segoe UI", sans-serif;
}
/* Preferences drawer. A panel rather than a <dialog>: it slides in from the
   right, and dialog's own backdrop cannot be animated independently of it.
   translateX keeps the transition on the compositor. */
#scrim {
  position: fixed; inset: 0; background: rgba(0,0,0,.35);
  opacity: 0; pointer-events: none; transition: opacity .2s ease; z-index: 8;
}
#scrim.open { opacity: 1; pointer-events: auto; }
#drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(30rem, 100vw);
  background: var(--panel); border-left: 1px solid var(--line);
  transform: translateX(100%); transition: transform .22s ease;
  z-index: 9; display: flex; flex-direction: column;
}
#drawer.open { transform: translateX(0); }
@media (prefers-reduced-motion: reduce) {
  #drawer, #scrim { transition: none; }
}
#drawer header {
  position: static; display: flex; align-items: center; gap: .5rem;
  border-bottom: 1px solid var(--line);
}
#drawer h2 { font-size: 1rem; margin: 0 auto 0 0; font-weight: 600; }
#drawer-body { overflow-y: auto; padding: .75rem 1rem 1rem; flex: 1; }
#drawer-foot {
  display: flex; align-items: center; gap: .75rem;
  padding: .7rem 1rem; border-top: 1px solid var(--line);
}
#drawer-note { color: var(--muted); font-size: .78rem; flex: 1; }
#drawer-body h3 {
  font-size: .8rem; text-transform: uppercase; letter-spacing: .04em;
  color: var(--muted); margin: 1.25rem 0 .5rem; font-weight: 600;
}
#drawer-body h3:first-child { margin-top: .25rem; }
.pref { display: grid; gap: .25rem; margin-bottom: .8rem; }
.pref label { font-size: .85rem; }
.pref .desc { color: var(--muted); font-size: .78rem; }
.pref .row { display: flex; gap: .4rem; align-items: center; }
.pref .row input[type=text], .pref .row select { flex: 1; min-width: 0; }
.pref .row input[type=number] { width: 8rem; }
.pref .unit { color: var(--muted); font-size: .8rem; }
.pref code { font-size: .75rem; color: var(--muted); }
.hamburger { line-height: 1; padding: .3rem .55rem; }
header {
  display: flex; flex-wrap: wrap; gap: .75rem 1.25rem; align-items: center;
  padding: .7rem 1rem; border-bottom: 1px solid var(--line); background: var(--panel);
  position: sticky; top: 0; z-index: 5;
}
h1 { font-size: 1.05rem; margin: 0 auto 0 0; font-weight: 600; }
.stat { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.stat b { color: var(--fg); font-weight: 600; }
button {
  font: inherit; padding: .35rem .7rem; border: 1px solid var(--line);
  border-radius: 6px; background: var(--bg); color: var(--fg); cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { color: #fff; filter: brightness(1.1); }
button.danger:hover { border-color: var(--danger); color: var(--danger); }

/* Phone width: the title takes its own line so the stats and controls have
   room to wrap. Without this the nowrap stats overflow the header and the
   whole page scrolls sideways, which is exactly what .tablewrap exists to
   prevent for the table. */
@media (max-width: 620px) {
  h1 { width: 100%; margin: 0; }
  header { gap: .5rem .9rem; padding: .6rem .7rem; }
  .stat { font-size: .85rem; }
  /* No margin-left:auto here. Pushing the button to the far right of a flex
     line that is already full makes it overflow instead of wrapping - let it
     flow after the theme picker and drop to its own line when it must. */
}

main { padding: 1rem; }
/* Wide content scrolls in its own box - the page body never scrolls sideways. */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; min-width: 720px; }
th, td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid var(--line); }
th { background: var(--panel); font-weight: 600; position: sticky; top: 0; }
tr:last-child td { border-bottom: 0; }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.name { max-width: 30rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { padding: 3rem 1rem; text-align: center; color: var(--muted); }

.bar { position: relative; width: 8rem; height: 1.1rem; background: var(--bar-bg); border-radius: 4px; overflow: hidden; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--bar); display: block; }
/* The label sits over both the grey track and the coloured fill, so neither a
   light nor a dark colour is readable everywhere. A halo in the page
   background keeps it legible over both, in both themes. */
.bar > span {
  position: relative; display: block; text-align: center;
  font-size: .75rem; line-height: 1.1rem;
  text-shadow: 0 0 2px var(--bg), 0 0 2px var(--bg), 0 0 3px var(--bg);
}
.state { font-size: .8rem; color: var(--muted); }
.state.err { color: var(--danger); }
.state.up { color: var(--ok); }
.actions { display: flex; gap: .3rem; }

dialog {
  border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
  color: var(--fg); padding: 0; max-width: min(38rem, 94vw); width: 100%;
}
dialog::backdrop { background: #0008; }
.dlg-head { padding: .8rem 1rem; border-bottom: 1px solid var(--line); font-weight: 600; }
.dlg-body { padding: 1rem; display: grid; gap: .8rem; }
.dlg-foot { padding: .8rem 1rem; border-top: 1px solid var(--line); display: flex; gap: .5rem; justify-content: flex-end; }
label { display: grid; gap: .3rem; font-size: .85rem; color: var(--muted); }
input[type=text], input[type=file], textarea {
  font: inherit; padding: .45rem .55rem; border: 1px solid var(--line);
  border-radius: 6px; background: var(--panel); color: var(--fg); width: 100%;
}
/* Vertical only: the dialog is a grid and a wider textarea would push the
   Browse button off the row beside it. */
textarea { resize: vertical; min-height: 2.4rem; }
/* The "one per line" asides on the add form. Lighter than the label itself,
   which is already muted, so it reads as a note rather than a second label. */
.hint { opacity: .7; font-weight: 400; }

/* Torrent inspection: queue on the left, that torrent's files on the right.
   Fixed height so adding twenty torrents cannot grow the dialog off-screen -
   both panes scroll instead. */
.inspect { display: grid; grid-template-columns: 190px 1fr; gap: .5rem; height: 210px; }
.inspect-queue, .inspect-files {
  border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
  display: flex; flex-direction: column; min-width: 0;
}
.inspect-queue { overflow-y: auto; }
.inspect-list { overflow-y: auto; flex: 1; }
.inspect-head {
  padding: .35rem .5rem; background: var(--panel); border-bottom: 1px solid var(--line);
  font-size: .8rem; color: var(--muted); white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis;
}
.q-item {
  padding: .4rem .5rem; cursor: pointer; border-bottom: 1px solid var(--line);
  font-size: .8rem; overflow: hidden;
}
.q-item:last-child { border-bottom: 0; }
.q-item.sel { background: var(--accent); color: #fff; }
.q-item .q-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.q-item .q-size { display: block; opacity: .75; font-size: .72rem; }
.f-item {
  display: flex; gap: .4rem; align-items: center; padding: .25rem .5rem;
  font-size: .8rem; min-width: 0;
}
.f-item:nth-child(odd) { background: var(--panel); }
.f-item .f-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.f-item .f-size { color: var(--muted); font-size: .72rem; white-space: nowrap; }

/* Narrow screens: the two panes stack rather than squeezing the file names
   into nothing. */
@media (max-width: 560px) {
  .inspect { grid-template-columns: 1fr; height: 300px; }
}
/* The file input's inner button is a native control and keeps the browser's
   own light styling on a dark page unless it is styled by name. */
input[type=file]::file-selector-button {
  font: inherit; margin-right: .6rem; padding: .3rem .6rem; cursor: pointer;
  border: 1px solid var(--line); border-radius: 5px;
  background: var(--bg); color: var(--fg);
}
input[type=file]::file-selector-button:hover { border-color: var(--accent); color: var(--accent); }
.row { display: flex; gap: .5rem; align-items: end; }
.row > label { flex: 1; }
.check { display: flex; gap: .4rem; align-items: center; color: var(--fg); font-size: .9rem; }

#browser-list { max-height: 45vh; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; }
#browser-list button {
  display: block; width: 100%; text-align: left; border: 0; border-radius: 0;
  border-bottom: 1px solid var(--line); padding: .4rem .6rem; background: none;
}
#browser-list button:last-child { border-bottom: 0; }
#browser-path { font-family: ui-monospace, Consolas, monospace; font-size: .8rem; color: var(--muted); word-break: break-all; }

#toasts { position: fixed; right: 1rem; bottom: 1rem; display: grid; gap: .5rem; z-index: 10; max-width: min(28rem, 92vw); }
.toast { padding: .6rem .8rem; border-radius: 8px; border: 1px solid var(--danger); background: var(--panel); color: var(--danger); font-size: .85rem; }
.toast.info { border-color: var(--accent); color: var(--accent); }
</style>

<header>
  <h1>NanoTorrent <span class="stat" id="version"></span></h1>
  <span class="stat">&darr; <b id="dl">0 B/s</b></span>
  <span class="stat">&uarr; <b id="ul">0 B/s</b></span>
  <span class="stat">DHT <b id="dht">-</b></span>
  <span class="stat"><b id="count">0</b> torrents</span>
  <select id="theme" title="{{theme}}" aria-label="{{theme}}">
    <option value="auto">{{theme_system}}</option>
    <option value="light">{{light_theme}}</option>
    <option value="dark">{{theme_dark}}</option>
  </select>
  <button class="primary" id="btn-add">{{add_torrent_s}}</button>
  <button class="hamburger" id="btn-prefs" title="{{preferences}}" aria-label="{{preferences}}"
          aria-controls="drawer" aria-expanded="false">&#9776;</button>
</header>

<div id="scrim"></div>
<aside id="drawer" aria-hidden="true" aria-label="{{preferences}}">
  <header>
    <h2>{{preferences}}</h2>
    <button type="button" id="drawer-close" aria-label="Close">&times;</button>
  </header>
  <div id="drawer-body"></div>
  <div id="drawer-foot">
    <span id="drawer-note"></span>
    <button type="button" class="primary" id="drawer-save" disabled>{{save_changes}}</button>
  </div>
</aside>

<main>
  <div class="tablewrap">
    <table>
      <thead><tr>
        <th>{{name}}</th><th>{{size}}</th><th>{{progress}}</th><th>{{status}}</th>
        <th class="num">&darr;</th><th class="num">&uarr;</th>
        <th class="num">{{peers}}</th><th class="num">{{ratio}}</th><th>{{actions}}</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="empty" id="empty" hidden>{{no_torrents_yet}}</div>
</main>

<dialog id="add">
  <form method="dialog">
    <div class="dlg-head">{{add_torrent_s}}</div>
    <div class="dlg-body">
      <label>{{magnet_link}}<span class="hint"> - {{magnet_hint}}</span>
        <textarea id="add-magnet" rows="2" placeholder="magnet:?xt=urn:btih:..."></textarea>
      </label>
      <label>{{or_torrent_files}}<span class="hint"> - {{files_hint}}</span>
        <input type="file" id="add-file" multiple accept=".torrent,application/x-bittorrent">
      </label>
      <div class="row">
        <label>{{save_to}}
          <input type="text" id="add-path" placeholder="server default">
        </label>
        <button type="button" id="add-browse">{{browse_folder}}</button>
      </div>
      <label class="check"><input type="checkbox" id="add-start" checked> {{start_immediately}}</label>

      <!-- Appears once the chosen .torrent files have been read by
           /api/torrents/inspect. Same two panes as the desktop dialog: the
           batch down the left, the selected torrent's files on the right. -->
      <div class="inspect" id="add-inspect" hidden>
        <div class="inspect-queue" id="add-queue"></div>
        <div class="inspect-files">
          <div class="inspect-head" id="add-fhead"></div>
          <div class="inspect-list" id="add-files"></div>
        </div>
      </div>
    </div>
    <div class="dlg-foot">
      <button value="cancel">{{cancel}}</button>
      <button class="primary" id="add-ok" value="ok">{{add}}</button>
    </div>
  </form>
</dialog>

<dialog id="browser">
  <div class="dlg-head">{{choose_folder}}</div>
  <div class="dlg-body">
    <div id="browser-path"></div>
    <div class="row">
      <button type="button" id="browser-up">Up</button>
      <button type="button" id="browser-mkdir">{{new_folder}}</button>
    </div>
    <div id="browser-list"></div>
  </div>
  <div class="dlg-foot">
    <button type="button" id="browser-cancel">{{cancel}}</button>
    <button type="button" class="primary" id="browser-pick">{{use_this_folder}}</button>
  </div>
</dialog>

<div id="toasts"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

// --- formatting -------------------------------------------------------------
const UNITS = ["B", "KB", "MB", "GB", "TB", "PB"];
function bytes(n) {
  if (n === null || n === undefined || n < 0) return "-";
  let u = 0;
  while (n >= 1024 && u < UNITS.length - 1) { n /= 1024; u++; }
  return (u === 0 ? n : n.toFixed(2)) + " " + UNITS[u];
}
const speed = (n) => (n > 0 ? bytes(n) + "/s" : "-");
function eta(s) {
  if (s === null || s === undefined) return "-";
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m";
  if (s < 86400) return Math.floor(s / 3600) + "h";
  return Math.floor(s / 86400) + "d";
}
const STATES = {
  downloading: "Downloading", downloading_paused: "Paused", downloading_metadata: "Metadata",
  downloading_checking: "Checking", downloading_queued: "Queued",
  uploading: "Seeding", uploading_paused: "Paused", uploading_queued: "Queued",
  checking_files: "Checking", checking_resume_data: "Checking", error: "Error", unknown: "Unknown",
};

function toast(message, kind) {
  const el = document.createElement("div");
  el.className = "toast" + (kind === "info" ? " info" : "");
  el.textContent = message;                       // never innerHTML - see header
  $("toasts").append(el);
  setTimeout(() => el.remove(), 8000);
}

// --- api --------------------------------------------------------------------
// Credentials come from the browser's own Basic auth prompt, triggered by the
// 401 the server sends. No login form to build, and no token to store.
async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);
  if (!res.ok) {
    let detail = await res.text().catch(() => "");
    throw new Error(detail.trim() || (res.status + " " + res.statusText));
  }
  return res.status === 204 ? null : res.json();
}

// --- torrent list -----------------------------------------------------------
function actionButton(text, cls, onClick) {
  const b = document.createElement("button");
  b.textContent = text;
  if (cls) b.className = cls;
  b.addEventListener("click", onClick);
  return b;
}

function cell(row, text, cls) {
  const td = row.insertCell();
  if (cls) td.className = cls;
  if (text !== undefined) td.textContent = text;
  return td;
}

async function act(fn) {
  try { await fn(); await refresh(); }
  catch (e) { toast(e.message); }
}

function renderRows(list) {
  const body = $("rows");
  body.textContent = "";
  $("empty").hidden = list.length > 0;

  for (const t of list) {
    const row = body.insertRow();
    const name = cell(row, t.name, "name");
    name.title = t.name + "\n" + t.save_path;

    cell(row, bytes(t.size), "num");

    const prog = cell(row);
    const bar = document.createElement("div");
    bar.className = "bar";
    const fill = document.createElement("i");
    fill.style.width = Math.round(t.progress * 100) + "%";
    const label = document.createElement("span");
    label.textContent = (t.progress * 100).toFixed(1) + "%";
    bar.append(fill, label);
    prog.append(bar);

    const state = cell(row);
    const s = document.createElement("div");
    s.className = "state" + (t.error ? " err" : t.state === "uploading" ? " up" : "");
    s.textContent = t.error ? "Error" : STATES[t.state] || t.state;
    if (t.error) s.title = t.error;
    state.append(s);
    if (!t.paused && t.eta_seconds !== null) {
      const e = document.createElement("div");
      e.className = "state";
      e.textContent = "ETA " + eta(t.eta_seconds);
      state.append(e);
    }

    cell(row, speed(t.download_rate), "num");
    cell(row, speed(t.upload_rate), "num");
    cell(row, t.peers + " (" + t.peers_total + ")", "num");
    cell(row, t.ratio.toFixed(2), "num");

    const actions = cell(row);
    const box = document.createElement("div");
    box.className = "actions";
    box.append(
      t.paused
        ? actionButton("Resume", "", () => act(() => api("POST", `/api/torrents/${t.info_hash}/resume`)))
        : actionButton("Pause", "", () => act(() => api("POST", `/api/torrents/${t.info_hash}/pause`))),
      // Points the torrent at data that has already been moved; it does not
      // move anything. The browser opens at the current save path because the
      // new location is usually a sibling of the old one.
      actionButton("Location", "", () => {
        openBrowser(t.save_path || null, (path) => {
          act(() => api("POST", `/api/torrents/${t.info_hash}/location`, { path }));
        });
      }),
      actionButton("Remove", "danger", () => {
        // Two questions, because the second one is unrecoverable.
        if (!confirm(`Remove "${t.name}" from NanoTorrent?`)) return;
        const withData = confirm("Also DELETE the downloaded files from disk?\n\nOK = delete files, Cancel = keep them.");
        act(() => api("DELETE", `/api/torrents/${t.info_hash}?delete_files=${withData}`));
      }),
    );
    actions.append(box);
  }
}

// Translations for the strings this script builds. Injected by the server
// so the page never renders English first and repaints.
const T = {{__T__}};

// --- preferences drawer -----------------------------------------------------
// Rendered from /api/settings, which describes every preference and the control
// it needs. Nothing about the individual settings is written here: the server
// owns the list, the types and the validation, so a setting added to the CLI
// registry shows up in this drawer with no change to this file.
let prefsLoaded = false;
// name -> value, for the controls touched since the drawer was filled.
const pending = new Map();

function prefControl(s) {
  const wrap = document.createElement("div");
  wrap.className = "pref";

  const id = "pref-" + s.name;
  const label = document.createElement("label");
  label.htmlFor = id;
  label.textContent = s.description;
  wrap.append(label);

  const row = document.createElement("div");
  row.className = "row";
  let input;

  if (s.kind === "bool") {
    input = document.createElement("input");
    input.type = "checkbox";
    input.checked = s.value === "true";
  } else if (s.kind === "choice") {
    input = document.createElement("select");
    // A setting that has never been written reads back as "(unset)", which
    // matches no option and would leave the box blank - looking broken rather
    // than unset. Show it, disabled, so it cannot be chosen deliberately.
    if (!s.options.includes(s.value)) {
      const ph = document.createElement("option");
      ph.value = s.value; ph.textContent = s.value; ph.disabled = true;
      input.append(ph);
    }
    for (let i = 0; i < s.options.length; i++) {
      const opt = document.createElement("option");
      opt.value = s.options[i];
      // Labels differ from values where the value is a code: the language
      // picker lists "Nederlands", not "nl-NL".
      opt.textContent = (s.labels && s.labels[i]) || s.options[i];
      input.append(opt);
    }
    input.value = s.value;
  } else if (s.kind === "int") {
    input = document.createElement("input");
    input.type = "number";
    if (s.min !== undefined) input.min = s.min;
    if (s.max !== undefined) input.max = s.max;
    // "(unset)" is not a number; leave the box empty rather than showing it.
    input.value = /^-?\d+$/.test(s.value) ? s.value : "";
  } else {
    input = document.createElement("input");
    input.type = "text";
    input.value = s.value === "(unset)" ? "" : s.value;
  }
  input.id = id;
  row.append(input);

  if (s.unit) {
    const u = document.createElement("span");
    u.className = "unit";
    u.textContent = s.unit;
    row.append(u);
  }
  // A folder setting gets the same picker the Add dialog uses.
  if (s.kind === "dir") {
    const browse = document.createElement("button");
    browse.type = "button";
    browse.textContent = T.browse_folder;
    browse.addEventListener("click", () => {
      openBrowser(input.value || null, (path) => {
        input.value = path;
        input.dispatchEvent(new Event("change"));
      });
    });
    row.append(browse);
  }
  wrap.append(row);

  const desc = document.createElement("div");
  desc.className = "desc";
  desc.innerHTML = "";
  const code = document.createElement("code");
  code.textContent = s.name;
  desc.append(code);
  wrap.append(desc);

  // Edits are collected, not sent: Save writes them, applies them and reloads.
  // Per-control saving meant a half-changed configuration was live the whole
  // time it took to fill the panel in.
  const read = () => (s.kind === "bool" ? String(input.checked) : input.value);
  const initial = read();
  function changed() {
    const now = read();
    if (now === initial) pending.delete(s.name);
    else pending.set(s.name, now);
    $("drawer-save").disabled = pending.size === 0;
    $("drawer-note").textContent = pending.size
      ? pending.size + " " + T.changes_to_save
      : "";
  }
  input.addEventListener("change", changed);
  input.addEventListener("input", changed);
  return wrap;
}

async function loadPrefs() {
  const body = $("drawer-body");
  body.textContent = T.loading;
  try {
    const sections = await api("GET", "/api/settings");
    body.textContent = "";
    for (const sec of sections) {
      const h = document.createElement("h3");
      h.textContent = sec.name;
      body.append(h);
      for (const s of sec.settings) body.append(prefControl(s));
    }
    prefsLoaded = true;
    pending.clear();
    $("drawer-save").disabled = true;
    $("drawer-note").textContent = "";
  } catch (e) {
    body.textContent = e.message;
  }
}

// Writes every pending change, asks the session to pick them up, then reloads.
//
// Reloading rather than patching the page in place: a language change has to
// redraw every caption, and a theme change the whole palette. One reload is
// both simpler and more obviously correct than replaying each of those.
async function savePrefs() {
  const btn = $("drawer-save");
  btn.disabled = true;
  $("drawer-note").textContent = T.saving;

  for (const [name, value] of pending) {
    try {
      await api("POST", "/api/settings", { name, value });
    } catch (e) {
      // Stop on the first rejection, with the offending field named: carrying
      // on would leave some of the panel applied and some not.
      toast(name + ": " + e.message);
      $("drawer-note").textContent = "";
      btn.disabled = false;
      return;
    }
  }

  try {
    await api("POST", "/api/settings/apply");
  } catch (e) {
    toast(e.message);
  }
  location.reload();
}
$("drawer-save").addEventListener("click", savePrefs);

function openPrefs() {
  $("drawer").classList.add("open");
  $("scrim").classList.add("open");
  $("drawer").setAttribute("aria-hidden", "false");
  $("btn-prefs").setAttribute("aria-expanded", "true");
  if (!prefsLoaded) loadPrefs();
}
function closePrefs() {
  $("drawer").classList.remove("open");
  $("scrim").classList.remove("open");
  $("drawer").setAttribute("aria-hidden", "true");
  $("btn-prefs").setAttribute("aria-expanded", "false");
}
$("btn-prefs").addEventListener("click", openPrefs);
$("drawer-close").addEventListener("click", closePrefs);
$("scrim").addEventListener("click", closePrefs);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && $("drawer").classList.contains("open")) closePrefs();
});
// Deep link, so the drawer can be bookmarked and linked to.
if (location.hash === "#preferences") openPrefs();

// --- polling ----------------------------------------------------------------
let failures = 0;
async function refresh() {
  try {
    const [info, list, errs] = await Promise.all([
      api("GET", "/api/session"),
      api("GET", "/api/torrents"),
      api("GET", "/api/errors"),
    ]);
    $("version").textContent = "v" + info.version;
    $("dl").textContent = speed(info.download_rate);
    $("ul").textContent = speed(info.upload_rate);
    $("dht").textContent = info.dht_nodes === null ? "-" : info.dht_nodes;
    $("count").textContent = info.torrents;
    renderRows(list);
    // The session error queue drains on read, so anything here is new.
    for (const e of errs.errors) toast(e);
    failures = 0;
  } catch (e) {
    // Only complain once per outage, or a closed laptop lid produces a wall
    // of identical toasts.
    if (failures++ === 0) toast(T.lost_contact + ": " + e.message);
  }
}

// --- folder browser ---------------------------------------------------------
let browsingPath = null;
let onFolderPicked = null;

async function browseTo(path) {
  try {
    const listing = await api("GET", "/api/fs/list?path=" + encodeURIComponent(path));
    browsingPath = listing.path;
    $("browser-path").textContent = listing.path;
    $("browser-up").disabled = !listing.parent;
    $("browser-up").dataset.parent = listing.parent || "";

    const box = $("browser-list");
    box.textContent = "";
    const dirs = listing.entries.filter((e) => e.is_dir);
    if (!dirs.length) {
      const none = document.createElement("div");
      none.style.padding = ".6rem";
      none.style.color = "var(--muted)";
      none.textContent = T.no_subfolders;
      box.append(none);
    }
    for (const d of dirs) {
      box.append(actionButton("\u{1F4C1}  " + d.name, "", () => browseTo(d.path)));
    }
  } catch (e) {
    toast(e.message);
  }
}

async function openBrowser(startPath, cb) {
  onFolderPicked = cb;
  $("browser").showModal();
  if (startPath) { await browseTo(startPath); return; }
  try {
    const roots = await api("GET", "/api/fs/roots");
    await browseTo(roots.downloads);
  } catch (e) { toast(e.message); }
}

$("browser-up").addEventListener("click", (e) => {
  const parent = e.currentTarget.dataset.parent;
  if (parent) browseTo(parent);
});
$("browser-mkdir").addEventListener("click", async () => {
  const name = prompt("Name for the new folder:");
  if (!name) return;
  try {
    const sep = browsingPath.includes("\\") ? "\\" : "/";
    const target = browsingPath.replace(/[\\/]$/, "") + sep + name;
    const listing = await api("POST", "/api/fs/mkdir", { path: target });
    await browseTo(listing.path);
    toast("Created " + listing.path, "info");
  } catch (e) { toast(e.message); }
});
$("browser-cancel").addEventListener("click", () => $("browser").close());
$("browser-pick").addEventListener("click", () => {
  if (onFolderPicked && browsingPath) onFolderPicked(browsingPath);
  $("browser").close();
});

// --- add dialog -------------------------------------------------------------
$("btn-add").addEventListener("click", () => {
  $("add-magnet").value = "";
  $("add-file").value = "";
  $("add-path").value = "";
  $("add-start").checked = true;
  clearInspection();
  $("add").showModal();
});

$("add-browse").addEventListener("click", () => {
  openBrowser($("add-path").value || null, (p) => { $("add-path").value = p; });
});

const readAsBase64 = (file) => new Promise((resolve, reject) => {
  const r = new FileReader();
  // The data: URL carries a "...;base64," prefix the API must not receive.
  r.onload = () => resolve(String(r.result).split(",", 2)[1]);
  r.onerror = () => reject(new Error("could not read " + file.name));
  r.readAsDataURL(file);
});

// --- torrent inspection -----------------------------------------------------
// Chosen .torrent files are read by the server (/api/torrents/inspect) so the
// remote can show the same name, size and file list the desktop dialog does,
// and untick files before adding. The server reuses the desktop's own parser,
// so the two always agree about what a torrent contains.
//
// Magnets are not inspected: there is nothing to look at until their metadata
// resolves, which is exactly why the desktop resolves them first and this does
// not try to.
let inspected = [];   // { b64, name, total_size, files, included[] }
let selected = 0;

function clearInspection() {
  inspected = [];
  selected = 0;
  $("add-inspect").hidden = true;
  $("add-queue").textContent = "";
  $("add-files").textContent = "";
  $("add-fhead").textContent = "";
}

function renderQueue() {
  const q = $("add-queue");
  q.textContent = "";
  // One pane is pointless for a single torrent - its name is already in the
  // header below. Collapse the column too, or the file list keeps a 190px
  // gap beside it where the queue would have been.
  const single = inspected.length < 2;
  q.hidden = single;
  $("add-inspect").style.gridTemplateColumns = single ? "1fr" : "";
  if (single) return;
  inspected.forEach((t, i) => {
    const item = document.createElement("div");
    item.className = "q-item" + (i === selected ? " sel" : "");
    const name = document.createElement("span");
    name.className = "q-name";
    name.textContent = t.name;                    // never innerHTML - see header
    const size = document.createElement("span");
    size.className = "q-size";
    size.textContent = bytes(t.total_size);
    item.append(name, size);
    item.addEventListener("click", () => { selected = i; renderQueue(); renderFiles(); });
    q.append(item);
  });
}

function renderFiles() {
  const t = inspected[selected];
  const list = $("add-files");
  list.textContent = "";
  if (!t) { $("add-fhead").textContent = ""; return; }

  const on = t.included.filter(Boolean).length;
  $("add-fhead").textContent =
    `${t.name} - ${bytes(t.total_size)}, ${on}/${t.files.length} file${t.files.length > 1 ? "s" : ""}`;

  t.files.forEach((f, i) => {
    const row = document.createElement("div");
    row.className = "f-item";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = t.included[i];
    cb.addEventListener("change", () => {
      t.included[i] = cb.checked;
      // Re-render for the count in the header; the list is small enough that
      // rebuilding it is cheaper to write than to patch in place.
      renderFiles();
    });
    const name = document.createElement("span");
    name.className = "f-name";
    name.textContent = f.path;                    // attacker-controlled
    name.title = f.path;
    const size = document.createElement("span");
    size.className = "f-size";
    size.textContent = bytes(f.size);
    row.append(cb, name, size);
    list.append(row);
  });
}

$("add-file").addEventListener("change", async () => {
  const files = [...$("add-file").files];
  clearInspection();
  if (!files.length) return;

  try {
    const items = await Promise.all(
      files.map(async (f) => ({ torrent_file: await readAsBase64(f) })),
    );
    const metas = await api("POST", "/api/torrents/inspect", items.length === 1 ? items[0] : items);
    inspected = metas.map((m, i) => ({
      b64: items[i].torrent_file,
      name: m.name,
      total_size: m.total_size,
      files: m.files,
      included: m.files.map(() => true),
    }));
    $("add-inspect").hidden = false;
    renderQueue();
    renderFiles();
  } catch (e) {
    // Leave the picker as it is so the mistake is visible and fixable.
    clearInspection();
    toast(e.message);
  }
});

$("add").addEventListener("close", async () => {
  if ($("add").returnValue !== "ok") return;
  // Blank lines are what you get from pasting a list, not an error.
  const magnets = $("add-magnet").value.split("\n").map(m => m.trim()).filter(Boolean);
  const files = [...$("add-file").files];
  const savePath = $("add-path").value.trim();

  if (!magnets.length && !files.length) { toast(T.give_magnet_or_file); return; }
  if (magnets.length && files.length) { toast(T.give_not_both); return; }

  // Every entry carries the same save path and start flag - the form only
  // offers one of each, and the endpoint takes them per torrent.
  const common = { start: $("add-start").checked };
  if (savePath) common.save_path = savePath;

  try {
    const items = magnets.length
      ? magnets.map(magnet => ({ ...common, magnet }))
      : inspected.map(t => {
          // Positions in the metainfo order the inspect endpoint returned,
          // which is what only_files indexes by. Omitted when everything is
          // ticked: null means "all", which is not the same as listing them.
          const keep = t.included.flatMap((on, i) => (on ? [i] : []));
          const item = { ...common, torrent_file: t.b64 };
          if (keep.length !== t.files.length) item.only_files = keep;
          return item;
        });

    if (!items.length) { toast(T.nothing_to_add); return; }
    if (items.some(i => i.only_files && !i.only_files.length)) {
      toast(T.all_files_unticked);
      return;
    }

    // One request for the batch: the endpoint validates them all before
    // adding any, so a bad entry cannot half-apply the list.
    await api("POST", "/api/torrents", items.length === 1 ? items[0] : items);

    // 202: accepted, not added. A magnet has to resolve its metadata first,
    // so say "queued" rather than claiming it is downloading.
    const n = items.length;
    toast(
      magnets.length
        ? `${n} magnet${n > 1 ? "s" : ""} queued - resolving metadata...`
        : `${n} torrent${n > 1 ? "s" : ""} added.`,
      "info",
    );
    await refresh();
  } catch (e) { toast(e.message); }
});

// --- theme ------------------------------------------------------------------
// Mirrors the desktop's View > Theme: auto follows the OS, light and dark
// override it. `?theme=` wins for one page load without touching the stored
// preference, which is what makes both palettes screenshot-testable.
function applyTheme(value) {
  if (value === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", value);
}
{
  const stored = localStorage.getItem("theme") || "auto";
  const forced = new URLSearchParams(location.search).get("theme");
  const initial = ["auto", "light", "dark"].includes(forced) ? forced : stored;
  $("theme").value = initial;
  applyTheme(initial);
  $("theme").addEventListener("change", (e) => {
    applyTheme(e.target.value);
    localStorage.setItem("theme", e.target.value);
  });
}

// Poll interval in seconds; `?refresh=0` freezes the page on one snapshot.
//
// That switch is also what makes this page testable headlessly: Chromium's
// --virtual-time-budget waits for the network to fall idle before capturing,
// and a page that re-polls every two seconds never does, so a screenshot run
// hangs until it is killed.
const REFRESH = Number(new URLSearchParams(location.search).get("refresh") ?? 2);
refresh();
if (REFRESH > 0) setInterval(refresh, REFRESH * 1000);
</script>
