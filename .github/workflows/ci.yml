# Proves the portability claim rather than inferring it.
#
# Development happens on Windows. Whether the Linux and macOS arms of the
# cfg(windows) / cfg(target_os) branches actually compile is a question only
# those platforms can answer, so they answer it here.
#
# The runners already ship cmake and a C compiler, which aws-lc-sys needs. No
# OpenSSL is required: the librqbit rust-tls feature (see Cargo.toml) keeps
# libssl out of the tree entirely.

name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Without this a Linux failure would cancel the macOS job, hiding whether
      # the problem is one platform or both.
      fail-fast: false
      matrix:
        include:
          # Default features are ui-slint, so these three build the same UI on
          # all three platforms - which is the whole point of it.
          - name: windows (slint UI)
            os: windows-latest
            args: ""
          - name: linux (slint UI)
            os: ubuntu-latest
            args: ""
            apt: libfontconfig1-dev
          - name: macos (slint UI)
            os: macos-latest
            args: ""
          - name: windows (headless)
            os: windows-latest
            args: --no-default-features
          - name: linux (headless)
            os: ubuntu-latest
            args: --no-default-features
          - name: macos (headless)
            os: macos-latest
            args: --no-default-features

    steps:
      - uses: actions/checkout@v4

      - name: System packages
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - uses: dtolnay/rust-toolchain@stable

      # aws-lc-sys is a slow C build and cargo re-links it constantly otherwise.
      - uses: Swatinem/rust-cache@v2
        with:
          # matrix.name, not matrix.os: each OS appears twice with different
          # feature sets, and one cache key for both would thrash.
          key: ${{ matrix.name }}

      - name: Build
        run: cargo build --locked ${{ matrix.args }}

      # Tests are headless; nothing here opens a window.
      - name: Test
        run: cargo test --locked ${{ matrix.args }}
