# Where .github/workflows/publish.yml sends a published GitHub release.
# true = send it, false = skip it. Read from the default branch when the
# workflow runs, so a change takes effect once it is pushed - no new release
# needed.
#
# The keys live in GitHub, never here: repo > Settings > Secrets and
# variables > Actions.

# AUR package nanotorrent-bin. Needs the secret AUR_SSH_PRIVATE_KEY.
aur=false

# itch.io. Needs the secret BUTLER_API_KEY. itch_game is <user>/<game slug>,
# the end of the game's URL: power2all.itch.io/nanotorrent -> power2all/nanotorrent
itch=true
itch_game=power2all/nanotorrent
